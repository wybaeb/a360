<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Параметры проекта: Накопительный счёт: удержание закрываемых счетов</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222
    }
    .drop{
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: #555
    }
    .drop.over{
      border-color: #2a9d5c;
      background: #f0faf4
    }
    table{
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0
    }
    td, th{
      border-bottom: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left
    }
    .tile{
      display: inline-block;
      min-width: 200px;
      margin: 8px 16px 8px 0
    }
    .tile b{
      display: block;
      font-size: 26px
    }
    .line{
      font-family: monospace;
      background: #f4f4f4;
      padding: 8px 10px;
      border-radius: 8px
    }
    #status{
      color: #b33
    }
  </style>
</head>
<body>
  <h1>Параметры проекта: Накопительный счёт: удержание закрываемых счетов</h1>
  <div class="drop" id="drop">Перетащите сюда файлы closures_dm.csv, linked_crm.csv, margin_fin.csv или 
    <label><u>выберите их</u>
      <input type="file" id="files" multiple accept=".csv" style="display:none"></label>
  </div>
  <p id="status"></p>
  <div id="out"></div>
  <div id="chart"></div>
  
  <script>
    const FILES = ["closures_dm.csv", "linked_crm.csv", "margin_fin.csv"];
    let tables = {};
    
    function parseCsv(text) {
      const lines = text.replace(/\uFEFF/, '').split(/\r?\n/)
        .filter(l => l.trim() !== '');
      const head = lines[0].split(';').map(h => h.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cells = lines[i].split(';');
        const row = {};
        for (let j = 0; j < head.length; j++) {
          const v = (cells[j] || '').trim();
          const n = parseFloat(v.replace(',', '.'));
          row[head[j]] = (v !== '' && !isNaN(n)) ? n : v;
        }
        rows.push(row);
      }
      return rows;
    }

    function computeInputs(tables) {
      // Расчёт closures
      const closuresArr = tables['closures_dm.csv'].slice(-12).map(row => row['закрытые_счета']);
      const closures = closuresArr.reduce((acc, curr) => acc + curr) / closuresArr.length;
      
      // Расчёт linked
      const linkedSums = tables['linked_crm.csv'].map(row => row['закрытий_после_обращения']);
      const totalClosed = tables['linked_crm.csv'].map(row => row['закрытых_счетов_всего']).reduce((sum, val) => sum + val);
      const linked = linkedSums.reduce((acc, curr) => acc + curr) / totalClosed;
      
      // Расчёт margin
      const avgBalance = tables['margin_fin.csv'][0]['средний_остаток_тыс_руб'] * 1000;
      const interestRate = tables['margin_fin.csv'][0]['маржа_проц_годовых'];
      const monthsInYear = tables['margin_fin.csv'][0]['срок_жизни_счёта_мес'];
      const margin = avgBalance * interestRate / 100 / monthsInYear;
      
      return { closures, linked, margin };
    }

    function fmt(v) {
      return (v === null || v === undefined || isNaN(v)) ? '—' : `${Math.round(v * 100) / 100}.`.replace('.', ',');
    }

    function render() {
      const missing = FILES.filter(f => !tables[f]);
      if (missing.length > 0) {
        document.getElementById('status').textContent = `Ожидаются файлы: ${missing.join(', ')}`;
        return;
      }
      const inputs = computeInputs(tables);
      const delta = inputs.closures * inputs.linked * 1/3;
      const volume = 1;
      const price = inputs.margin;
      const html = `
        <h2>Входы</h2>
        <table>
          <tr>
            <th>Вход</th>
            <th>Значение</th>
          </tr>
          <tr>
            <td>Закрытия счетов в месяц (closures)</td>
            <td>${fmt(inputs.closures)} счетов в месяц</td>
          </tr>
          <tr>
            <td>Доля закрытий после обращения (linked)</td>
            <td>${fmt(inputs.linked)} доля от 0 до 1</td>
          </tr>
          <tr>
            <td>Маржа на счёт в месяц (margin)</td>
            <td>${fmt(inputs.margin)} руб.</td>
          </tr>
        </table>
        <h2>Параметры финансовой модели</h2>
        <div class="tile"><b>${fmt(delta)}</b> Изменение показателя, предотвращённых закрытий в месяц</div>
        <div class="tile"><b>${fmt(volume)}</b> Объём, —</div>
        <div class="tile"><b>${fmt(price)}</b> Стоимость единицы, руб. маржи на счёт в месяц</div>
        <p>Маржинальный доход от удержанных счетов: <b>${fmt(delta * volume * price)}</b> руб. в месяц на когорту</p>
        <p class="line">delta=${delta}; volume=${volume}; price=${price}</p>
      `;
      document.getElementById('status').textContent = '';
      document.getElementById('out').innerHTML = html;
      drawChart();
    }

    function drawChart() {
      const rows = tables[FILES[0]];
      if (!rows || rows[0]['месяц'] === undefined) return;
      const col = Object.keys(rows[0]).filter(k => k !== 'месяц' && typeof rows[0][k] === 'number')[0];
      const data = rows.map(row => [row['месяц'], row[col]]);
      const chartData = data.map(([month, value]) => ({ month, value }));
      const svg = d3.select('#chart')
        .append('svg')
        .attr('viewBox', '0 0 860 260')
        .attr('width', '100%');
      const xScale = d3.scaleBand().domain(chartData.map(d => d.month)).range([60, 800]);
      const yScale = d3.scaleLinear()
        .domain([d3.min(chartData, d => d.value), d3.max(chartData, d => d.value)])
        .range([20, 240]);
      const line = d3.line()
        .x(d => xScale(d.month))
        .y(d => yScale(d.value));
      svg.append('path')
        .datum(chartData)
        .attr('d', line)
        .attr('fill', 'none')
        .attr('stroke', '#2a9d5c')
        .attr('stroke-width', 3);
      svg.append('text')
        .attr('x', 6)
        .attr('y', 24)
        .attr('font-size', '12')
        .attr('text-anchor', 'end')
        .text(fmt(d3.max(chartData, d => d.value)));
      svg.append('text')
        .attr('x', 6)
        .attr('y', 240)
        .attr('font-size', '12')
        .attr('text-anchor', 'end')
        .text(fmt(d3.min(chartData, d => d.value)));
      svg.selectAll('.month')
        .data(chartData)
        .enter()
        .append('text')
        .attr('class', 'month')
        .attr('x', d => xScale(d.month) + xScale.bandwidth() / 2)
        .attr('y', 240)
        .attr('text-anchor', 'middle')
        .text(d => d.month);
    }

    function readFiles(files) {
      files.forEach(file => {
        if (FILES.includes(file.name)) {
          const reader = new FileReader();
          reader.onload = ev => {
            tables[file.name] = parseCsv(ev.target.result);
            render();
          };
          reader.readAsText(file, 'utf-8');
        } else {
          document.getElementById('status').textContent = `Файл не поддерживается: ${file.name}`;
        }
      });
    }

    const dropEl = document.getElementById('drop');
    dropEl.addEventListener('dragover', event => {
      event.preventDefault();
      dropEl.className = 'drop over';
    });
    dropEl.addEventListener('dragleave', () => dropEl.className = 'drop');
    dropEl.addEventListener('drop', event => {
      event.preventDefault();
      dropEl.className = 'drop';
      readFiles(event.dataTransfer.files);
    });
    document.getElementById('files').addEventListener('change', () => readFiles(this.files));

    render();
  }

  </script>
</body>
</html>
