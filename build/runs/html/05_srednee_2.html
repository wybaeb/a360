<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчёт по срокам рассмотрения заявок</title>
  <style>
    body {
      background-color: white;
      color: #2E3641;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0 auto;
      padding: 20px;
      max-width: 920px;
    }
    h1 {font-size: 24px;}
    p {font-size: 14px; line-height: 1.5;}
    section.card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border: 1px solid #e6ecf1;
      border-radius: 14px;
      margin-bottom: 24px;
    }
    div.key-metric {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
      font-size: 32px;
      line-height: 1;
      color: inherit;
    }
    span.sub-label {
      font-size: 14px;
      color: #8A94A0;
      margin-top: 4px;
    }
    .graphic-svg {
      display: block;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #e6ecf1;
    }
    tr:nth-child(even) {background-color: #F9FAFB;}
    tbody tr:last-child td {border-bottom: none;}
    .track{
      display:inline-block;width:320px;height:14px;background:#eef2f5;
      border-radius:7px;vertical-align:middle
    }
    .bar{
      display:block;height:14px;background:#20BA72;border-radius:7px
    }
    .row{
      display:flex;align-items:center;gap:12px;margin:6px 0
    }
  </style>
</head>
<body>
<h1>Среднее: норматив выполнен, клиент ждёт неделю</h1>
<p>Проверено соответствие сроков рассмотрения заявок нормативному показателю.</p>
<div id="keyMetrics" class="card"></div>
<div id="histogram" class="graphic-svg"></div>
<div id="sharesBars"></div>
<div id="conversionBars"></div>
<table id="basketTable">
  <thead><tr><th>Корзина</th><th>Заявки</th><th>% заявок</th><th>Конверсия в выдачу</th></tr></thead>
  <tbody></tbody>
</table>
<div id="conclusion" class="card"></div>
<script src="msb_applications_q.js"></script>
<script>
function formatNum(v) {
  if (!Number.isFinite(v)) return '';
  return v.toFixed(1).replace('.', ',');
}
if (!window.DATA || !Array.isArray(window.DATA)) {
  document.body.innerText = 'Ошибка загрузки данных. Файл msb_applications_q.js должен лежать рядом со страницей.';
} else {
  const data = window.DATA.filter(row => row.tat_days !== null && row.issued !== null);
  
  // Число заявок
  const totalApps = data.length;

  // Срок рассмотрения заявок
  let days = data.map(row => row.tat_days)
                .filter(Number.isFinite);

  // Среднее
  const avgDays = days.reduce((sum, val) => sum + val, 0) / days.length;

  // Медиана
  const sortedDays = [...days].sort((a, b) => a - b);
  const medianIndex = Math.floor(sortedDays.length / 2);
  const medianDays = sortedDays.length % 2 ? sortedDays[medianIndex]
                 : (sortedDays[medianIndex - 1] + sortedDays[medianIndex]) / 2;

  // Перцентиль 90%
  const percentile90Index = (sortedDays.length - 1) * 0.9;
  const lower = Math.floor(percentile90Index);
  const upper = Math.ceil(percentile90Index);
  const percent90Days = sortedDays[lower] +
                        ((percentile90Index - lower) *
                         (sortedDays[upper] - sortedDays[lower]));

  // Выше нормы (более 3 дней)
  const overNormCount = days.filter(day => day > 3).length;
  const overNormShare = overNormCount / totalApps;

  // Корзины срока
  const basketData = [
    ['До 1 дня', d => d <= 1],
    ['1–3 дня', d => d > 1 && d <= 3],
    ['3–7 дней', d => d > 3 && d <= 7],
    ['Больше 7 дней', d => d > 7]
  ];

  const baskets = basketData.map(basket => ({
    label: basket[0],
    count: days.filter(basket[1]).length,
    share: '',
    conversion: ''
  }));

  for (let basket of baskets) {
    basket.share = `${formatNum(basket.count / totalApps * 100)}%`;
    
    const issuedInBasket = data.filter(d => basketData.find(b => b[0] == basket.label)[1](d.tat_days))
                               .reduce((acc, cur) => acc + cur.issued, 0);
    basket.conversion = formatNum(issuedInBasket / basket.count * 100);
  }

  // Недостающая конверсия
  const bestConversionRate = Math.max(...baskets.map(b => parseFloat(b.conversion)));
  const missedConversions = baskets.filter(b => b.label != 'До 1 дня')
                                   .map(b => (bestConversionRate - parseFloat(b.conversion)) * b.count)
                                   .reduce((acc, curr) => acc + curr, 0);

  // Визуализация ключевых метрик
  const keyMetricsEl = document.getElementById('keyMetrics');
  keyMetricsEl.innerHTML += `
    <div class="key-metric">${formatNum(avgDays)}<br/><span class="sub-label">Средний срок</span></div>
    <div class="key-metric">${formatNum(medianDays)}<br/><span class="sub-label">Медианный срок</span></div>
    <div class="key-metric">${formatNum(percent90Days)}<br/><span class="sub-label">Перцентиль 90%</span></div>
    <div class="key-metric">${formatNum(overNormShare*100)}%<br/><span class="sub-label">Выше нормы</span></div>
  `;

  // Рисуем гистограмму
  const histogramEl = document.getElementById('histogram');
  const bins = [];
  for(let i = 0; i < 28; i++) {
    bins.push({from: i * 0.5, to: (i + 1) * 0.5});
  }
  bins.push({from: 14, to: Infinity}); // Последний интервал для всего свыше 14

  const binCounts = bins.map(bin =>
    days.filter(day => day >= bin.from && (bin.to === Infinity ? true : day < bin.to)).length
  );

  const maxBinHeight = Math.max(...binCounts);
  const numBins = bins.length;

  const histSVG = `<svg viewBox="0 0 800 280" style="width:100%;height:auto;display:block;">`+
                  '<defs>'+
                    '<linearGradient id="gradGreenRed">'+
                      '<stop offset="0%" stop-color="#20BA72"/>'+
                      '<stop offset="60%" stop-color="#E4572E"/>'+
                    '</linearGradient>'+
                  '</defs>'+
                  '<rect x="52" y="16" width="732" height="234" fill="url(#gradGreenRed)" opacity="0.1"/>'; // Фон градиент
  
  const binWidth = 732 / numBins;
  let prevX = 52;
  for(let i = 0; i < numBins; i++) {
    const xPos = prevX + i * binWidth;
    const heightProp = binCounts[i] / maxBinHeight;
    const rectY = 250 - heightProp * 234;
    const fillColor = i > 6 ? '#E4572E' : '#20BA72';
    histSVG += `<rect x="${Math.round(xPos)}" y="${Math.round(rectY)}"`
               +" width='"+Math.round(binWidth)+"' height='"+(250-Math.round(rectY))+"'"
               +' fill="'+fillColor+'" rx="2"/>';
  }

  // Нормативная линия
  const normLineX = 52 + 6 * binWidth; // 3 дня соответствует 6-му интервалу
  histSVG += `<line x1="${normLineX}" y1="16" x2="${normLineX}" y2="250" stroke="#FFC107" stroke-width="2"/>`
            +'<text x="'+(normLineX+10)+'" y="260" font-size="11" fill="#8a94a0">Норматив</text>'
            +'</svg>';

  histogramEl.innerHTML = histSVG;

  // Шары долей и конверсии
  const sharesBarsEl = document.getElementById('sharesBars');
  const convBarsEl = document.getElementById('conversionBars');

  function drawBarChart(el, values, labels, maxValue) {
    el.innerHTML = '';
    for(let i = 0; i < values.length; i++) {
      const value = values[i];
      const label = labels[i];
      const percentage = Math.min(value / maxValue * 100, 100);
      const formattedVal = formatNum(value);
      
      el.innerHTML += `
        <div class="row">
          <span class="lab">${label}</span>
          <span class="track"><span class="bar" style="width:${percentage}%"></span></span>
          <span class="val">${formattedVal}</span>
        </div>
      `;
    }
  }

  drawBarChart(sharesBarsEl, baskets.map(b => b.count), baskets.map(b => b.label), totalApps);
  drawBarChart(convBarsEl, baskets.map(b => parseFloat(b.conversion)), 
              baskets.map(b => b.label+" ("+formatNum(parseFloat(b.conversion))+"%)"), 100);

  // Таблица корзин
  const basketTableBody = document.querySelector('#basketTable tbody');
  basketTableBody.innerHTML = baskets.map(basket => `
    <tr>
      <td>${basket.label}</td>
      <td>${basket.count}</td>
      <td>${basket.share}</td>
      <td>${basket.conversion}%</td>
    </tr>`).join('');

  // Заключение
  const conclusionEl = document.getElementById('conclusion');
  conclusionEl.innerHTML = `
    <p>Срок рассмотрения заявок удовлетворяет нормативу, однако большинство клиентов ожидает решения около недели.<br/>
       Повышение скорости обработки снизило бы ожидание и увеличило бы общую конверсию выдачи на дополнительные ${formatNum(missedConversions)} заявок.</p>
  `;
}
</script>
</body>
</html>
