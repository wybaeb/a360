<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчет по срокам рассмотрения заявок МСБ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { text-align: center; margin-top: 2em; }
        p.info { text-align: center; color: #666; margin-bottom: 2em; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        tbody tr:nth-child(even) { background-color: #f2f2f2; }
        .track{display:inline-block;width:320px;height:14px;background:#eef2f5;
               border-radius:7px;vertical-align:middle}
        .bar{display:block;height:14px;background:#20BA72;border-radius:7px}
        .row{display:flex;align-items:center;gap:12px;margin:6px 0}
    </style>
</head>
<body>
<h1>Среднее: норматив выполнен, клиент ждёт неделю</h1>
<p class="info">Проверяем сроки обработки заявок малого бизнеса.</p>
<div id="report-container"></div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const reportContainer = document.getElementById('report-container');
    
    // Загрузка данных
    fetch('../data/msb_applications_q.csv')
        .then(response => response.text())
        .then(data => processData(data))
        .catch(error => reportContainer.innerText = 'Ошибка загрузки данных: ' + error);

    function processData(csvData) {
        let rows = csvData.trim().split('\n').slice(1); // пропускаем заголовки

        let applications = [];
        
        for(let row of rows) {
            let [app_id, tat_days, issued] = row.split(',');
            applications.push({tat_days: parseFloat(tat_days), issued: parseInt(issued)});
        }

        // Средние показатели
        let totalDays = applications.reduce((sum, a) => sum + a.tat_days, 0);
        let meanTAT = totalDays / applications.length;
        let medianTAT = calculateMedian(applications.map(a => a.tat_days));
        let percentile90 = calculatePercentile(applications.map(a => a.tat_days), 90);

        // Доля нарушений норматива >3 дней
        let violationsCount = applications.filter(a => a.tat_days > 3).length;
        let violationRate = violationsCount / applications.length * 100;

        // Корзины сроков
        let bins = [
            {label: '<=1 день', filter: a => a.tat_days <= 1},
            {label: '1-3 дня', filter: a => a.tat_days > 1 && a.tat_days <= 3},
            {label: '3-7 дней', filter: a => a.tat_days > 3 && a.tat_days <= 7},
            {label: '>7 дней', filter: a => a.tat_days > 7}
        ];

        let binStats = bins.map(bin => {
            let filteredApps = applications.filter(bin.filter);
            return {
                count: filteredApps.length,
                share: filteredApps.length / applications.length * 100,
                conversion: filteredApps.reduce((sum, a) => sum + a.issued, 0) / filteredApps.length * 100 || 0
            };
        });

        // Недобор выдач
        let bestConversionBin = binStats.sort((a,b) => b.conversion - a.conversion)[0];
        let missedIssues = binStats.slice(1).reduce((total, stat) => 
            total + (stat.count * (bestConversionBin.conversion - stat.conversion) / 100), 0);

        // Форматирование чисел
        function formatNumber(num) {
            return num.toLocaleString('ru-RU', {minimumFractionDigits: 1, maximumFractionDigits: 1});
        }

        // Генерация отчёта
        reportContainer.innerHTML += `
            <table>
                <tr><th colspan="3">Основные метрики:</th></tr>
                <tr><td>Средний срок рассмотрения:</td><td>${formatNumber(meanTAT)} дней</td></tr>
                <tr><td>Медианный срок рассмотрения:</td><td>${formatNumber(medianTAT)} дней</td></tr>
                <tr><td>90-й перцентиль срока:</td><td>${formatNumber(percentile90)} дней</td></tr>
                <tr><td>Доля нарушений норматива (>3 дней):</td><td>${formatNumber(violationRate)}%</td></tr>
            </table>
            
            <h2>Корзины сроков рассмотрения</h2>
            ${binStats.map(stat => `<div class="row"><span class="lab">${stat.label}</span>
              <span class="track"><span class="bar" style="width:${formatNumber(Math.abs(stat.share))}%"></span></span>
              <span class="val">${formatNumber(stat.count)} (${formatNumber(stat.share)}%)</span></div>`).join('')}
              
            <h2>Конверсия в выдаче по корзинам</h2>
            ${binStats.map(stat => `<div class="row"><span class="lab">${stat.label}</span>
              <span class="track"><span class="bar" style="width:${formatNumber(Math.abs(stat.conversion))}%"></span></span>
              <span class="val">${formatNumber(stat.conversion)}%</span></div>`).join('')}
            
            <h2>Недостающие выдачи</h2>
            <p>При ускорении работы до уровня самой быстрой корзины удалось бы выдать ещё примерно ${formatNumber(missedIssues)} заявок.</p>
            
            <h2>Вывод</h2>
            <p>Срок рассмотрения заявок ниже норматива (<strong>в среднем меньше недели</strong>), однако значительная доля клиентов ожидает решения дольше трёх дней.<br/>
            Повышение эффективности обработки заявок позволит существенно увеличить объём выдач.</p>
        `;
    }

    // Вспомогательные функции
    function calculateMedian(arr) {
        arr.sort((a,b) => a-b);
        let midIndex = Math.floor(arr.length / 2);
        if (arr.length % 2 === 0) {
            return (arr[midIndex - 1] + arr[midIndex]) / 2;
        } else {
            return arr[midIndex];
        }
    }

    function calculatePercentile(arr, p) {
        arr.sort((a,b) => a-b);
        let index = ((arr.length - 1) * p / 100);
        let lower = Math.floor(index);
        let upper = Math.ceil(index);
        if (lower == upper) return arr[lower];
        return arr[lower] + (index - lower) * (arr[upper] - arr[lower]);
    }
});
</script>
</body>
</html>
