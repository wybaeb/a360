<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчет по сезонам кредитования</title>
  <style>
    body {
      background-color: white;
      color: #2E3641;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0 auto;
      padding: 24px;
      max-width: 920px;
    }
    h1 {font-size: 24px;}
    p {font-size: 14px; line-height: 1.5em;}
    section {padding-bottom: 24px; border-bottom: 1px solid #e6ecf1;}
    .card {display: flex; justify-content: space-between; align-items: center; 
           gap: 12px; padding: 12px; border: 1px solid #e6ecf1; border-radius: 14px; 
           margin-top: 12px;}
    .kpi-value {font-weight: bold; font-size: 32px; color: #20BA72;}
    .kpi-label {color: #8a94a0; font-size: 14px;}
    table {width: 100%; border-collapse: collapse; margin-top: 12px;}
    th, td {text-align: right; padding: 6px 12px; border: 1px solid #e6ecf1;}
    tbody tr:nth-child(even) {background-color: #F8FAFB;}
    thead {background-color: #F8FAFB;}
    tfoot {font-style: italic; font-size: 12px;}
    .track{display:inline-block;width:320px;height:14px;background:#eef2f5;
          border-radius:7px;vertical-align:middle}
    .bar{display:block;height:14px;background:#20BA72;border-radius:7px}
    .row{display:flex;align-items:center;gap:12px;margin:6px 0}
    .warning {color: red; font-weight: bold;}
    svg {display: block; width: 100%; height: auto;}
  </style>
</head>
<body>
<h1>Сезонность: рост, которого нет</h1>
<p>Проверяем годовую динамику потребительских кредитов.</p>
<div id="kpis"></div>
<div id="chart"></div>
<div id="bars"></div>
<div id="table"></div>
<div id="conclusion"></div>
<script src="issues_daily_3y.js"></script>
<script>
function formatNum(v) {
  if (!Number.isFinite(v)) return v;
  let numStr = v.toFixed(1).replace('.', ',');
  return numStr.includes('%') ? numStr : `${numStr} млн`;
}
const DATA = window.DATA || [];
if (!DATA.length) {
  document.body.innerText = 'Файл issues_daily_3y.js должен лежать рядом со страницей';
} else {
  const dailyAmounts = DATA.map(d => d.amount_mln_rub)
                          .filter(Number.isFinite);
  
  // Кварталы и годы
  function getQuarter(dateStr) {
    const [year, month] = dateStr.split('-').map(Number);
    return [(Math.floor((month - 1) / 3) + 1), year];
  }
  
  const quartersSum = {};
  for (let row of DATA) {
    const [qtr, yr] = getQuarter(row.date);
    const key = `Q${qtr}-${yr}`;
    quartersSum[key] = (quartersSum[key] || 0) + row.amount_mln_rub;
  }
  
  const yearsSum = {};
  for (let q in quartersSum) {
    const parts = q.match(/(\d)-(\d\d\d\d)$/);
    const year = parts[2];
    yearsSum[year] = (yearsSum[year] || 0) + quartersSum[q];
  }
  
  // Ключевые показатели
  const Q4_2025_vs_Q3_2025 = ((quartersSum['Q4-2025'] / quartersSum['Q3-2025'] - 1) * 100).toFixed(1);
  const Q4_2025_vs_Q4_2024 = ((quartersSum['Q4-2025'] / quartersSum['Q4-2024'] - 1) * 100).toFixed(1);
  const Y2025_vs_Y2024 = ((yearsSum['2025'] / yearsSum['2024'] - 1) * 100).toFixed(1);
  
  const kpisMarkup = `
    <section>
      <div class="card">
        <div class="kpi-value">${formatNum(Q4_2025_vs_Q3_2025)}%</div>
        <div class="kpi-label">IV кв. 2025 к III кв. 2025</div>
      </div>
      <div class="card">
        <div class="kpi-value">${formatNum(Q4_2025_vs_Q4_2024)}%</div>
        <div class="kpi-label">IV кв. 2025 к IV кв. 2024</div>
      </div>
      <div class="card">
        <div class="kpi-value">${formatNum(Y2025_vs_Y2024)}%</div>
        <div class="kpi-label">2025 г. к 2024 г.</div>
      </div>
      <div class="card">
        <div class="kpi-value">${formatNum(yearsSum['2025'])}</div>
        <div class="kpi-label">Годовой итог 2025</div>
      </div>
    </section>
  `;
  document.getElementById('kpis').innerHTML = kpisMarkup;
  
  // Столбчатый график по месяцам
  const monthlyData = {};
  for (let row of DATA) {
    const [year, month] = row.date.split('-').map(Number);
    const key = `${year}-${month}`;
    monthlyData[key] = (monthlyData[key] || 0) + row.amount_mln_rub;
  }
  
  const monthsList = Object.keys(monthlyData).sort();
  const values = monthsList.map(k => monthlyData[k]);
  const colors = ['#A8E0C4', '#5BC98D', '#20BA72'];
  
  const minValue = Math.min(...values);
  const maxValue = Math.max(...values);
  
  const chartWidth = 732;
  const nMonths = monthsList.length;
  
  const rectWidth = chartWidth / nMonths * 0.8;
  const stepX = chartWidth / (nMonths - 1);
  
  const svgMarkup = `<svg viewBox="0 0 800 280" style="width:100%;height:auto;display:block">
    <!-- Grid -->
    <line x1="52" y1="16" x2="784" y2="16" stroke="#e6ecf1"/>
    <line x1="52" y1="74.5" x2="784" y2="74.5" stroke="#e6ecf1"/>
    <line x1="52" y1="133" x2="784" y2="133" stroke="#e6ecf1"/>
    <line x1="52" y1="191.5" x2="784" y2="191.5" stroke="#e6ecf1"/>
    <line x1="52" y1="250" x2="784" y2="250" stroke="#e6ecf1"/>
    
    <!-- Axis labels -->
    <text x="46" y="14" text-anchor="end" font-size="11" fill="#8a94a0">${formatNum(maxValue)}</text>
    <text x="46" y="256" text-anchor="end" font-size="11" fill="#8a94a0">${formatNum(minValue)}</text>
    <text x="65" y="272" font-size="11" fill="#8a94a0">Январь 2023</text>
    <text x="770" y="272" font-size="11" fill="#8a94a0">Декабрь 2025</text>
    
    <!-- Bars -->
    ${monthsList.map((m, idx) => {
      const value = monthlyData[m];
      const xPos = 52 + idx * stepX;
      const barHeight = (value - minValue) * 234 / (maxValue - minValue);
      const yPos = 250 - barHeight;
      const colorIdx = m.startsWith('2023') ? 0 : m.startsWith('2024') ? 1 : 2;
      return `<rect x="${xPos.toFixed(1)}" y="${yPos.toFixed(1)}" width="${rectWidth.toFixed(1)}" height="${barHeight > 0 ? barHeight.toFixed(1) : 0}" fill="${colors[colorIdx]}" rx="2"/>`
    }).join('')}
  </svg>`;
  document.getElementById('chart').innerHTML = svgMarkup;
  
  // Годовые итоги в виде полос
  const barsMarkup = `
    <section>
      <div class="row"><span class="lab">2023</span><span class="track"><span class="bar" style="width:${(100 * yearsSum['2023'] / Math.max(Math.abs(yearsSum['2023']), Math.abs(yearsSum['2024']), Math.abs(yearsSum['2025']))).toFixed(1)}%"></span></span><span class="val">${formatNum(yearsSum['2023'])}</span></div>
      <div class="row"><span class="lab">2024</span><span class="track"><span class="bar" style="width:${(100 * yearsSum['2024'] / Math.max(Math.abs(yearsSum['2023']), Math.abs(yearsSum['2024']), Math.abs(yearsSum['2025']))).toFixed(1)}%"></span></span><span class="val">${formatNum(yearsSum['2024'])}</span></div>
      <div class="row"><span class="lab">2025</span><span class="track"><span class="bar" style="width:${(100 * yearsSum['2025'] / Math.max(Math.abs(yearsSum['2023']), Math.abs(yearsSum['2024']), Math.abs(yearsSum['2025']))).toFixed(1)}%"></span></span><span class="val">${formatNum(yearsSum['2025'])}</span></div>
    </section>
  `;
  document.getElementById('bars').innerHTML = barsMarkup;
  
  // Итоговая таблица
  const tableMarkup = `
    <section>
      <table>
        <thead>
          <tr><th colspan="5">Итоги по кварталам и годам</th></tr>
        </thead>
        <tbody>
          <tr><td></td><td>I кв.</td><td>II кв.</td><td>III кв.</td><td>IV кв.</td><td>Итого</td></tr>
          <tr><td>2023</td><td>${formatNum(quartersSum['Q1-2023'])}</td><td>${formatNum(quartersSum['Q2-2023'])}</td><td>${formatNum(quartersSum['Q3-2023'])}</td><td>${formatNum(quartersSum['Q4-2023'])}</td><td>${formatNum(yearsSum['2023'])}</td></tr>
          <tr><td>2024</td><td>${formatNum(quartersSum['Q1-2024'])}</td><td>${formatNum(quartersSum['Q2-2024'])}</td><td>${formatNum(quartersSum['Q3-2024'])}</td><td>${formatNum(quartersSum['Q4-2024'])}</td><td>${formatNum(yearsSum['2024'])}</td></tr>
          <tr><td>2025</td><td>${formatNum(quartersSum['Q1-2025'])}</td><td>${formatNum(quartersSum['Q2-2025'])}</td><td>${formatNum(quartersSum['Q3-2025'])}</td><td>${formatNum(quartersSum['Q4-2025'])}</td><td>${formatNum(yearsSum['2025'])}</td></tr>
        </tbody>
      </table>
    </section>
  `;
  document.getElementById('table').innerHTML = tableMarkup;
  
  // Заключение
  const conclusion = `
    <section>
      <h2>Вывод:</h2>
      <p>Несмотря на краткосрочные всплески осенью, долгосрочная динамика показывает устойчивое сжатие объема потребительского кредитования. Каждый последующий год демонстрирует меньшие объемы, что свидетельствует о снижении активности потребителей и замедлении роста экономики.</p>
    </section>
  `;
  document.getElementById('conclusion').innerHTML = conclusion;
}
</script>
</body>
</html>
