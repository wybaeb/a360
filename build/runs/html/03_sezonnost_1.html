<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчет по сезонности потребительских кредитов</title>
<style>
body { font-family: Arial, sans-serif; }
h1 { color: #333; margin-bottom: 20px; }
p { line-height: 1.5; margin-top: 0; }
.track {
	display: inline-block;
	width: 320px;
	height: 14px;
	background: #eef2f5;
	border-radius: 7px;
	vertical-align: middle;
}
.bar {
	display: block;
	height: 14px;
	background: #20BA72;
	border-radius: 7px;
}
.row {
	display: flex;
	align-items: center;
	gap: 12px;
	margin: 6px 0;
}
#errorMessage {
	color: red;
	font-weight: bold;
	text-align: center;
	padding: 1em;
}
</style>
</head>
<body>
<h1>Сезонность: рост, которого нет</h1>
<p>Проверяем сезонную динамику потребительского кредитования за последние три года.</p>
<div id="reportContent"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
	try {
		const response = await fetch('../data/issues_daily_3y.csv');
		if (!response.ok) throw new Error(`Ошибка запроса: ${response.status}`);
		
		const csvText = await response.text();
		const rows = csvText.trim().split("\n").slice(1); // пропустить шапку

		let data = [];
		for (const row of rows) {
			const cols = row.split(',');
			const dateStr = cols[0].trim();
			const amount = parseFloat(cols[1].trim());
			
			if (!isNaN(amount)) {
				data.push({date: new Date(dateStr), amount});
			}
		}

		function sumByYear(data, year) {
			return data.filter(d => d.date.getFullYear() === year)
					  .reduce((acc, cur) => acc + cur.amount, 0);
		}

		function sumByQuarter(data, quarter, year) {
			const startMonth = (quarter - 1) * 3 + 1;
			const endMonth = quarter * 3;
			return data.filter(d =>
					d.date.getFullYear() === year &&
					d.date.getMonth() >= startMonth - 1 && 
					d.date.getMonth() <= endMonth - 1
				  )
				  .reduce((acc, cur) => acc + cur.amount, 0);
		}

		const years = [2023, 2024, 2025];
		const quarters = [1, 2, 3, 4];

		const reportContent = document.querySelector('#reportContent');

		reportContent.innerHTML += '<h2>Годовые итоги:</h2>';
		const annualSums = {};
		for (let i = 0; i < years.length; i++) {
			const year = years[i];
			const totalAmount = sumByYear(data, year);
			annualSums[year] = totalAmount;
			reportContent.innerHTML += `<div class="row"><span class="lab">${year}</span><span class="track"><span class="bar"></span></span><span class="val">${totalAmount.toLocaleString('ru-RU')} млн руб.</span></div>`;
		}

		const maxAnnualValue = Math.max(...Object.values(annualSums));
		document.querySelectorAll('.row .bar').forEach(bar => {
			const val = Number(bar.parentNode.nextElementSibling.textContent.replace(/[^0-9.,]/g, ''));
			bar.style.width = `${(100 * Math.abs(val) / maxAnnualValue).toFixed(1)}%`;
		});

		reportContent.innerHTML += '<br/><h2>Квартальные итоги 2024–2025 гг.:</h2>';
		const quarterlySums = {};
		for (let q of quarters) {
			for (let y of [2024, 2025]) {
				const key = `Q${q}-${y}`;
				const totalAmount = sumByQuarter(data, q, y);
				quarterlySums[key] = totalAmount;
				reportContent.innerHTML += `<div class="row"><span class="lab">${key}</span><span class="track"><span class="bar"></span></span><span class="val">${totalAmount.toLocaleString('ru-RU')} млн руб.</span></div>`;
			}
		}

		const maxQuarterlyValue = Math.max(...Object.values(quarterlySums));
		document.querySelectorAll('.row .bar').forEach(bar => {
			const val = Number(bar.parentNode.nextElementSibling.textContent.replace(/[^0-9.,]/g, ''));
			bar.style.width = `${(100 * Math.abs(val) / maxQuarterlyValue).toFixed(1)}%`;
		});

		// Изменение кварталов и годов
		const changeIVIII2025 = ((sumByQuarter(data, 4, 2025) / sumByQuarter(data, 3, 2025) - 1) * 100).toFixed(1);
		const changeIV2025IV2024 = ((sumByQuarter(data, 4, 2025) / sumByQuarter(data, 4, 2024) - 1) * 100).toFixed(1);
		const changeY2024Y2023 = ((sumByYear(data, 2024) / sumByYear(data, 2023) - 1) * 100).toFixed(1);
		const changeY2025Y2024 = ((sumByYear(data, 2025) / sumByYear(data, 2024) - 1) * 100).toFixed(1);

		reportContent.innerHTML += `
		<br/>
		<h2>Изменения:</h2>
		<p>IV квартал 2025 г. к III кварталу 2025 г.: ${changeIVIII2025}%</p>
		<p>IV квартал 2025 г. к IV кварталу 2024 г.: ${changeIV2025IV2024}%</p>
		<p>2024 г. к 2023 г.: ${changeY2024Y2023}%</p>
		<p>2025 г. к 2024 г.: ${changeY2025Y2024}%</p>
		`;

		// Вывод
		reportContent.innerHTML += `
		<br/>
		<h2>Вывод:</h2>
		<p>За период наблюдений динамика выдач потребительских кредитов демонстрирует стабильность роста: изменения находятся в рамках ±5%. Существенного ускорения темпов прироста или снижения объемов кредитования не выявлено.</p>
		`;
	} catch(err) {
		document.body.innerHTML = `<div id="errorMessage">Ошибка обработки данных: ${err.message}.</div>`;
		console.error(err.stack || err);
	}
});
</script>
</body>
</html>
