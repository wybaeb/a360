<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ ипотечного рынка</title>
<style>
body { font-family: sans-serif; }
h1 { color: #3973ac; margin-bottom: 1em; }
table { width: 100%; border-collapse: collapse; margin-top: 1em; }
th, td { padding: 0.5em; text-align: left; border-bottom: 1px solid #ddd; }
th { background-color: #f2f2f2; }
.track{display:inline-block;width:320px;height:14px;background:#eef2f5;border-radius:7px;vertical-align:middle;}
.bar{display:block;height:14px;background:#20BA72;border-radius:7px;}
.row{display:flex;align-items:center;gap:12px;margin:6px 0;}
.result p { font-weight: bold; margin: 1em 0; }
</style>
</head>
<body>
<h1>Низкая база: проценты без базы ничего не значат</h1>
<p>Отчет проверяет динамику выдачи ипотеки банками.</p>
<div id="error" style="color: red; display:none;">Ошибка загрузки данных!</div>
<div id="content"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('../data/mortgage_market.csv');
        if (!response.ok) throw new Error(`Ошибка HTTP ${response.status}`);
        let csvText = await response.text();
        
        // Парсим CSV
        const rows = csvText.trim().split("\n").slice(1); // пропускаем шапку таблицы
        const data = [];
        for(const row of rows){
            const cols = row.split(",").map(c => c.trim());
            const numCols = cols.slice(1).map(n => parseFloat(n));
            if(numCols.some(isNaN)) continue; // фильтруем некорректные строки
            data.push({
                bank: cols[0],
                was_bn_rub: numCols[0], 
                now_bn_rub: numCols[1]
            });
        }
        
        // Подсчитываем суммарные показатели рынка
        const totalWas = data.reduce((sum, d) => sum + d.was_bn_rub, 0);
        const totalNow = data.reduce((sum, d) => sum + d.now_bn_rub, 0);
        
        // Рассчитываем метрики
        const metrics = data.map(d => ({
            bank: d.bank,
            was_bn_rub: d.was_bn_rub.toFixed(1),
            now_bn_rub: d.now_bn_rub.toFixed(1),
            growth_pct: ((d.now_bn_rub/d.was_bn_rub - 1)*100).toFixed(1),
            abs_growth: (d.now_bn_rub-d.was_bn_rub).toFixed(1),
            share_was: (100*d.was_bn_rub/totalWas).toFixed(1),
            share_now: (100*d.now_bn_rub/totalNow).toFixed(1),
            delta_share_pp: (parseFloat(d.share_now)-parseFloat(d.share_was)).toFixed(1)
        }));
        
        // Определяем максимумы для построения полос
        const maxPctGrowth = Math.max(...metrics.map(m => Math.abs(parseFloat(m.growth_pct))));
        const maxAbsGrowth = Math.max(...metrics.map(m => Math.abs(parseFloat(m.abs_growth))));
        
        // Генерируем отчет
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML += '<h2>Темпы роста банков (%):</h2>';
        metrics.forEach(m => {
            contentDiv.innerHTML += `<div class="row"><span class="lab">${m.bank}</span><span class="track"><span class="bar" style="width:${Math.abs(parseFloat(m.growth_pct))/maxPctGrowth*100}%"></span></span><span class="val">${m.growth_pct.replace('.', ',')}%</span></div>`;
        });
        contentDiv.innerHTML += '<br/><h2>Абсолютный рост банков (млрд руб.):</h2>';
        metrics.forEach(m => {
            contentDiv.innerHTML += `<div class="row"><span class="lab">${m.bank}</span><span class="track"><span class="bar" style="width:${Math.abs(parseFloat(m.abs_growth))/maxAbsGrowth*100}%"></span></span><span class="val">${m.abs_growth.replace('.', ',')}</span></div>`;
        });
        contentDiv.innerHTML += `
            <h2>Итоговая таблица:</h2>
            <table>
                <thead>
                    <tr><th>Банк</th><th>Было (млрд)</th><th>Стало (млрд)</th><th>Темп роста, %</th><th>Прирост, млрд</th><th>Доля раньше, %</th><th>Доля теперь, %</th><th>Изменение доли, п.п.</th></tr>
                </thead>
                <tbody>
                    ${metrics.map(m => `
                        <tr>
                            <td>${m.bank}</td>
                            <td>${m.was_bn_rub.replace('.', ',')}</td>
                            <td>${m.now_bn_rub.replace('.', ',')}</td>
                            <td>${m.growth_pct.replace('.', ',')}%</td>
                            <td>${m.abs_growth.replace('.', ',')}</td>
                            <td>${m.share_was.replace('.', ',')}%</td>
                            <td>${m.share_now.replace('.', ',')}%</td>
                            <td>${m.delta_share_pp.replace('.', ',')}</td>
                        </tr>`).join('')}
                </tbody>
            </table>
            <div class="result">
                <p>Общий объем рынка вырос с ${totalWas.toFixed(1).replace('.', ',')} до ${totalNow.toFixed(1).replace('.', ',')} млрд рублей (${(totalNow/totalWas*100-100).toFixed(1).replace('.', ',')}%).</p>
                <p>Вывод: Развитие отдельных банков сильно различается, однако общий рынок увеличился незначительно.</p>
            </div>`;
    
    } catch(e) {
        document.getElementById('error').textContent = e.message;
        document.getElementById('error').style.display = 'block';
    }
});
</script>
</body>
</html>
