<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчет по сезонности потребительских кредитов</title>
  <style>
    body { font-family: Arial, sans-serif; }
    h1 { color: #333; margin-bottom: 12px; }
    p { line-height: 1.4; margin-top: 0; }
    .track {
      display: inline-block;
      width: 320px;
      height: 14px;
      background: #eef2f5;
      border-radius: 7px;
      vertical-align: middle;
    }
    .bar {
      display: block;
      height: 14px;
      background: #20BA72;
      border-radius: 7px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0;
    }
    .val {
      white-space: nowrap;
    }
  </style>
</head>
<body>
<h1>Сезонность: рост, которого нет</h1>
<p>Проверяются темпы роста выдач потребительских кредитов по кварталам и годам.</p>
<div id="output"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('../data/issues_daily_3y.csv');
    if (!response.ok) throw new Error(`Ошибка HTTP ${response.status}`);
    
    const csvText = await response.text();
    const rows = csvText.trim().split("\n").slice(1); // Пропускаем заголовки

    let data = [];
    for (const row of rows) {
      const [dateStr, amountStr] = row.split(',').map(s => s.trim());
      const amount = parseFloat(amountStr);
      
      if (!isNaN(amount)) {
        const year = +dateStr.slice(0, 4);
        const month = +dateStr.slice(5, 7)-1;
        const day = +dateStr.slice(8, 10);
        
        const d = new Date(year, month, day);
        const quarter = Math.floor(month / 3) + 1;
        
        data.push({ date: d, amount });
      }
    }

    const quartersSums = {};
    const yearsSums = {};

    for (let i=0; i<data.length; ++i) {
      const { date, amount } = data[i];
      const qYear = date.getFullYear()+'q'+Math.floor(date.getMonth()/3+1);
      const yYear = date.getFullYear();
  
      quartersSums[qYear] = (quartersSums[qYear] || 0) + amount;
      yearsSums[yYear] = (yearsSums[yYear] || 0) + amount;
    }

    const outputDiv = document.querySelector('#output');

    function formatNumber(n) {
      return n.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
    }

    function changeInPercent(newVal, oldVal) {
      return ((newVal / oldVal - 1)*100).toFixed(1)+' %';
    }

    const totalOutput = [
      `Годовые итоги (${'2023–2025'}):`,
      `<div class="row"><span class="lab">2023:</span><span class="track"><span class="bar"></span></span><span class="val">${formatNumber(yearsSums['2023'])} млн руб.</span></div>`,
      `<div class="row"><span class="lab">2024:</span><span class="track"><span class="bar"></span></span><span class="val">${formatNumber(yearsSums['2024'])} млн руб., ${changeInPercent(yearsSums['2024'], yearsSums['2023'])}</span></div>`,
      `<div class="row"><span class="lab">2025:</span><span class="track"><span class="bar"></span></span><span class="val">${formatNumber(yearsSums['2025'])} млн руб., ${changeInPercent(yearsSums['2025'], yearsSums['2024'])}</span></div>`
    ];

    const quarters = ['2024q1','2024q2','2024q3','2024q4','2025q1','2025q2','2025q3','2025q4'];
    const quartersOutput = [
      'Квартальные итоги (2024–2025 гг.):'
    ];

    let quartersMax = Math.max(...Object.values(quartersSums));

    for (const q of quarters) {
      const sumQ = quartersSums[q];
      quartersOutput.push(
        `<div class="row"><span class="lab">${q}:</span><span class="track"><span class="bar" style="width:${(sumQ/quartersMax*100).toFixed(1)}%"></span></span><span class="val">${formatNumber(sumQ)} млн руб.</span></div>`
      );
    }

    quartersOutput.push(
      `<div class="row"><span class="lab">IV кв. 2025 к III кв. 2025:</span><span class="val">${changeInPercent(quartersSums['2025q4'], quartersSums['2025q3'])}</span></div>`,
      `<div class="row"><span class="lab">IV кв. 2025 к IV кв. 2024:</span><span class="val">${changeInPercent(quartersSums['2025q4'], quartersSums['2024q4'])}</span></div>`
    );

    outputDiv.innerHTML += `
      <section>
        ${totalOutput.join('<br/>')}
      </section>
      <section>
        ${quartersOutput.join('<br/>')}
      </section>
      <section>
        <h2>Вывод</h2>
        Сопоставимые кварталы демонстрируют отсутствие значимых колебаний в объемах выдач кредита. Годовые показатели также подтверждают стабильность тренда без выраженного прироста или падения объема кредитования.
      </section>
    `;

  } catch(err) {
    document.body.innerHTML = '<pre>' + err.message + '</pre>';
  }
});
</script>
</body>
</html>
