<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ сроков рассмотрения заявок МСБ</title>
<style>
body { font-family: Arial, sans-serif; }
h1,h2,p { margin: 10px 0; }
.track{display:inline-block;width:320px;height:14px;background:#eef2f5;border-radius:7px;vertical-align:middle;}
.bar{display:block;height:14px;background:#20BA72;border-radius:7px;}
.row{display:flex;align-items:center;gap:12px;margin:6px 0;}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd;}
tr:nth-child(even){background-color:#f2f2f2;}
</style>
</head>
<body>
<h1>Среднее: норматив выполнен, клиент ждёт неделю</h1>
<p>Проверено: срок рассмотрения заявок малого бизнеса.</p>
<div id="result"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
fetch('../data/msb_applications_q.csv')
.then(response => response.text())
.then(text => {
const rows = text.trim().split("\n").slice(1); // Пропускаем шапку
let data = [];
for(let row of rows){
if(row.trim() === '') continue;
let cols = row.split(',').map(col => col.trim());
let appId = cols[0], days = parseFloat(cols[1]), issued = parseInt(cols[2]);
if(!isNaN(days)){
data.push({appId, days, issued});
}
}
// Расчеты
let totalApps = data.length;
let overNormCount = data.filter(d => d.days > 3).length;
let meanDays = data.reduce((sum,d)=>sum+d.days,0)/totalApps;
let medianDays = getMedian(data.map(d=>d.days));
let p90Days = getPercentile(data.map(d=>d.days),90);

// Корзины
let bins = [
{name:'До 1 дня',filter:d=>d.days<=1},
{name:'1-3 дня',filter:d=>d.days>1&&d.days<=3},
{name:'3-7 дней',filter:d=>d.days>3&&d.days<=7},
{name:'Больше 7 дней',filter:d=>d.days>7}];

let binResults = bins.map(bin=>{
let filteredData = data.filter(bin.filter);
return{
name:bin.name,
count:filteredData.length,
share:(filteredData.length/totalApps)*100,
conversion:filteredData.reduce((s,d)=>s+(d.issued?1:0),0)/filteredData.length*100};
});

// Недобор выдач
let bestConversionBin = binResults.sort((a,b)=>b.conversion-a.conversion)[0];
let potentialAdditionalIssues = binResults.slice(1).reduce((acc,r)=>{
let diff = r.count*(bestConversionBin.conversion-r.conversion)/100;
return acc+diff;
},0);

// Выводим результат
let resultEl = document.getElementById('result');
resultEl.innerHTML += `<strong>Средний срок:</strong> ${meanDays.toFixed(1)} дней<br/>
<strong>Медианный срок:</strong> ${medianDays.toFixed(1)} дней<br/>
<strong>90-й перцентиль:</strong> ${p90Days.toFixed(1)} дней<br/><br/>`;

resultEl.innerHTML += `<strong>Доля заявок дольше нормы (более 3 дней): </strong>${(overNormCount/totalApps*100).toFixed(1)}%<br/><br/>`;

resultEl.innerHTML += '<h2>Корзины сроков обработки заявок</h2>';
resultEl.innerHTML += '<table><thead><tr><th>Корзина</th><th>Количество заявок</th><th>Доля заявок</th><th>Конверсия выдачи</th></tr></thead><tbody>';
let maxCount = Math.max(...binResults.map(r=>r.count)), maxConv = Math.max(...binResults.map(r=>r.conversion));
for(let res of binResults){
resultEl.innerHTML += `
<tr>
<td>${res.name}</td>
<td>${res.count}</td>
<td><div class="row"><span class="lab">Доля</span><span class="track"><span class="bar" style="width:${(res.share/maxCount*100).toFixed(1)}%"></span></span><span class="val">${res.share.toFixed(1)}%</span></div></td>
<td><div class="row"><span class="lab">Конверсия</span><span class="track"><span class="bar" style="width:${(res.conversion/maxConv*100).toFixed(1)}%"></span></span><span class="val">${res.conversion.toFixed(1)}%</span></div></td>
</tr>`;
}
resultEl.innerHTML += '</tbody></table>';

resultEl.innerHTML += `<h2>Потенциальное увеличение выдач</h2>
<p>Дополнительная выдача, если все корзины будут иметь такую же конверсию, как лучшая (${(bestConversionBin.conversion).toFixed(1)}%):
<strong>${potentialAdditionalIssues.toFixed(0)} заявок</strong></p>`;

resultEl.innerHTML += `<h2>Вывод</h2>
<p>Средние сроки находятся ниже норматива, однако значительная доля клиентов ожидает решения более трёх дней. Оптимизация процессов позволит увеличить выдачу примерно на ${potentialAdditionalIssues.toFixed(0)} заявок.</p>`
})
.catch(error => {
document.body.innerText = `Ошибка загрузки данных: ${error.message}`;
});

function getMedian(arr){
arr=arr.sort((a,b)=>a-b);
let mid = arr.length/2;
return arr.length % 2 ? arr[mid|0]:(arr[mid-1]+arr[mid])/2;
}

function getPercentile(arr,P){
arr=arr.sort((a,b)=>a-b);
let index=(arr.length-1)*P/100;
let lowerIndex=Math.floor(index);
let upperIndex=lowerIndex+1;
let fraction=index%1;
return arr[upperIndex]-fraction*(arr[upperIndex]-arr[lowerIndex]);
}
});
</script>
</body>
</html>
