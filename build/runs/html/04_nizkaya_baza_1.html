<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ ипотечного рынка</title>
<style>
body { font-family: Arial, sans-serif; }
h1 { color: #333; margin-bottom: 1em; }
table { width: 100%; border-collapse: collapse; margin-top: 1em; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
th { background-color: #f2f2f2; }
.track{display:inline-block;width:320px;height:14px;background:#eef2f5;
      border-radius:7px;vertical-align:middle}
.bar{display:block;height:14px;background:#20BA72;border-radius:7px}
.row{display:flex;align-items:center;gap:12px;margin:6px 0}
</style>
</head>
<body>
<h1>Низкая база: проценты без базы ничего не значат</h1>
<p>Проверяем, насколько корректно интерпретируются высокие темпы роста на фоне низкой исходной базы.</p>
<div id="bars"></div>
<div id="output"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
fetch('../data/mortgage_market.csv')
.then(response => response.text())
.then(text => {
const rows = text.trim().split("\n").slice(1); // Пропускаем шапку

// Парсим данные
let data = [];
for(let row of rows){
if(row.trim() === '') continue;
let cols = row.split(',');
cols.forEach((col,i)=>cols[i]=parseFloat(col.trim()));
if(cols.some(isNaN)) continue;
data.push({bank: cols.shift(), was_bn_rub: cols[0], now_bn_rub: cols[1]});
}

// Общие показатели рынка
let totalWas = data.reduce((sum,d)=>sum+d.was_bn_rub,0);
let totalNow = data.reduce((sum,d)=>sum+d.now_bn_rub,0);

// Рассчитываем дополнительные метрики
data.forEach(d=>{
d.growth_rate = ((d.now_bn_rub/d.was_bn_rub)-1)*100;
d.absolute_growth = d.now_bn_rub-d.was_bn_rub;
d.share_was = (d.was_bn_rub/totalWas)*100;
d.share_now = (d.now_bn_rub/totalNow)*100;
d.delta_share = d.share_now-d.share_was;
});

// Максимумы для полос
let maxGrowthRate = Math.max(...data.map(d=>Math.abs(d.growth_rate)));
let maxAbsGrowth = Math.max(...data.map(d=>Math.abs(d.absolute_growth)));

// Генерируем графики
let barsHTML = '';
['growth_rate','absolute_growth'].forEach(metric=>{
barsHTML += `<h2>${metric==='growth_rate'?'Темпы прироста':'Абсолютный прирост'} (${metric})</h2>`;
data.forEach(d=>{
let v = d[metric];
barsHTML += `
<div class="row">
<span class="lab">${d.bank}</span>
<span class="track"><span class="bar" style="width:${(100*Math.abs(v)/max[d.metric]).toFixed(1)}%"></span></span>
<span class="val">${v.toLocaleString('ru',{maximumFractionDigits:1})} ${metric==='growth_rate'?'':'млрд руб.'}</span>
</div>`
})
})

// Таблица итоговых результатов
let tableHTML = '<table><thead><tr><th>Игрок</th><th>Было</th><th>Стало</th>'+
'<th>Темп,%</th><th>Прирост, млрд руб.</th><th>Доля была,%</th>'+
'<th>Доля стала,%</th><th>Изменение доли, п.п.</th></tr></thead>';
data.forEach(d=>{
tableHTML += `<tr><td>${d.bank}</td>` +
`<td>${d.was_bn_rub.toLocaleString('ru')}</td>` +
`<td>${d.now_bn_rub.toLocaleString('ru')}</td>` +
`<td>${d.growth_rate.toFixed(1)}</td>` +
`<td>${d.absolute_growth.toLocaleString('ru')}</td>` +
`<td>${d.share_was.toFixed(1)}</td>` +
`<td>${d.share_now.toFixed(1)}</td>` +
`<td>${d.delta_share.toFixed(1)}</td></tr>`
})
tableHTML+='</table>'

console.assert(totalShareAfter >=99 && totalShareAfter <=101,'Сумма долей должна давать ~100 %');

// Собираем результат
document.getElementById('bars').innerHTML=barsHTML;
document.getElementById('output').innerHTML=tableHTML+'<h2>Вывод:</h2>'+
`На рынке ипотек рост заметен у нескольких крупных игроков, однако темпы сильно зависят от размера начальной базы.`;
}).catch(err => document.body.innerText=`Ошибка загрузки данных: ${err}`);
});
</script>
</body>
</html>
