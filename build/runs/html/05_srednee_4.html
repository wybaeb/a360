<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анализ сроков обработки заявок МСБ</title>
  <style>
    body { font-family: Arial, sans-serif; }
    h1 { text-align: center; margin-top: 3em; }
    p { width: 60%; margin: auto; text-align: justify; line-height: 1.4; }
    table { width: 60%; margin: 3em auto; border-collapse: collapse; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    strong { color: green; }
    .track{display:inline-block;width:320px;height:14px;background:#eef2f5;
           border-radius:7px;vertical-align:middle}
    .bar{display:block;height:14px;background:#20BA72;border-radius:7px}
    .row{display:flex;align-items:center;gap:12px;margin:6px 0}
  </style>
</head>
<body>
<h1>Среднее: норматив выполнен, клиент ждёт неделю</h1>
<p>Отчёт показывает сроки обработки заявок малого бизнеса и соответствие нормативам.</p>
<div id="output"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('../data/msb_applications_q.csv');
    if (!response.ok) throw new Error(`Ошибка запроса ${response.status}`);
    
    const csvData = await response.text();
    let rows = csvData.split('\n').slice(1); // Пропускаем заголовки

    let applications = [];
    for (let row of rows) {
      if (row.trim() === '') continue;
      let [appId, tatDays, issued] = row.split(',');
      applications.push({ appId, tatDays: parseFloat(tatDays), issued });
    }

    function median(arr) {
      arr.sort((a,b)=>a-b);
      return arr.length % 2 !== 0 ? arr[(arr.length-1)/2]
                                  : (arr[arr.length/2]+arr[arr.length/2-1])/2;
    }

    function percentile(arr, pct) {
      arr.sort((a,b)=>a-b);
      const index = ((arr.length-1)*pct/100)|0;
      const frac = ((arr.length-1)*pct/100)%1;
      return frac > 0 ? arr[index]*frac + arr[index+1]*(1-frac) : arr[index];
    }

    let tatDaysArr = applications.map(a=>a.tatDays);
    let avgTAT = tatDaysArr.reduce((acc,v)=>acc+v,0)/tatDaysArr.length;
    let medTAT = median(tatDaysArr);
    let p90TAT = percentile(tatDaysArr, 90);
  
    let slowAppsCount = tatDaysArr.filter(d=>d>3).length;
    let slowAppPct = (slowAppsCount/applications.length * 100).toFixed(1);

    let bins = [
      { label:'до 1 дня', filter:d=>d<=1 },
      { label:'от 1 до 3 дней', filter:d=>d>1 && d<=3 },
      { label:'от 3 до 7 дней', filter:d=>d>3 && d<=7 },
      { label:'больше 7 дней', filter:d=>d>7 }
    ];

    let binResults = bins.map(bin=>{
      let filtered = applications.filter(app=>bin.filter(app.tatDays));
      let count = filtered.length;
      let conv = filtered.reduce((acc,a)=>acc+(parseInt(a.issued)||0),0)/count || 0;
      return {label: bin.label, count, share: count/applications.length, conversion: conv};
    });

    let bestConvBin = binResults.reduce((best,r)=>r.conversion>best.conversion?r:best,{});
    let potentialExtraIssues = binResults.slice(1).reduce((acc,r)=>{
      return acc + r.count * (bestConvBin.conversion-r.conversion);
    },0);

    document.getElementById("output").innerHTML += `
      <table>
        <tr><th colspan=2>Сроки рассмотрения заявок:</th></tr>
        <tr><td>Средний срок</td><td>${avgTAT.toFixed(1)} день</td></tr>
        <tr><td>Медианный срок</td><td>${medTAT.toFixed(1)} день</td></tr>
        <tr><td>90-й перцентиль</td><td>${p90TAT.toFixed(1)} день</td></tr>
        <tr><td>Доля заявок дольше 3 дней</td><td>${slowAppPct}%</td></tr>
      </table>
      
      <h2>Корзины сроков рассмотрения заявок</h2>
      <div class="bins-table">
        ${binResults.map(r=>{
          return `<div class="row"><span class="lab">${r.label}</span>
                 <span class="track"><span class="bar"
                   style="width:${(100*r.share).toFixed(1)}%"></span></span>
                 <span class="val">${(100*r.share).toFixed(1)}%, 
                    конверсия: ${(100*r.conversion).toFixed(1)}%</span></div>`;
        }).join('')}
      </div>
      
      <h2>Потенциальное увеличение выдачи</h2>
      <p>При ускорении обработки медленных корзин до уровня самой быстрой (${(100*bestConvBin.conversion).toFixed(1)}%) возможно дополнительное одобрение ещё примерно
       <strong>${potentialExtraIssues.toFixed(0)} заявок</strong>.</p>
      
      <h2>Вывод</h2>
      <p>Большинство заявок обрабатывается быстро, однако около четверти приходится ждать дольше трёх дней. Ускорение обработки медленно рассматриваемых заявок позволит значительно увеличить количество одобренных кредитов.</p>
    `;
  } catch(err) {
    document.body.innerText = err.message;
  }
});
</script>
</body>
</html>
