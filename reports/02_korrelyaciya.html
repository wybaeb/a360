<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчет по операциям</title>
  <style>
    body {font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#2E3641;}
    h1,h2,p {margin-bottom:.5em}
    /* overflow-x на карточке: широкая таблица прокручивается внутри неё,
       а не уводит за правый край всю страницу. */
    .card {padding:16px;border:1px solid #e6ecf1;border-radius:14px;margin-bottom:16px;
           overflow-x:auto}
    .keynum {display:inline-flex;justify-content:center;align-items:center;flex-direction:column;
             padding:16px;min-width:160px;text-align:center;font-weight:bold;font-size:32px;
             color:#2E3641;background-color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .small {font-size:14px;color:#8A94A0;margin-top:4px}
    table{border-collapse:collapse;width:100%}
    th,td{padding:8px;text-align:left;border-bottom:1px solid #e6ecf1}
    tbody tr:nth-child(even){background-color:#F8FAFB}
    .track{display:inline-block;width:320px;height:14px;background:#EEF2F5;border-radius:7px;vertical-align:middle}
    .bar{display:block;height:14px;background:#20BA72;border-radius:7px}
    .row{display:flex;align-items:center;gap:12px;margin:6px 0}
    @media(max-width:600px){
      .keynum{margin-right:0;margin-bottom:16px}
    }
  </style>
</head>
<body>
<h1>Общая причина: виноват релиз, а не контакт-центр</h1>
<p>Проверяем зависимость количества обращений клиентов от уровня отказов приложения.</p>
<div class="card">
  <div class="keynums">
    <div class="keynum" id="corrcallschurn"></div>
    <div class="keynum" id="correrrorscalls"></div>
    <div class="keynum" id="correrrorschurn"></div>
    <div class="keynum" id="partialcorrcallschurn"></div>
  </div>
</div>
<div class="card">
  <h2>Графики динамики</h2>
  <svg viewBox="0 0 800 280" style="width:100%;height:auto;display:block;" id="chart"></svg>
</div>
<div class="card">
  <h2>Связи показателей</h2>
  <div class="rows">
    <div class="row"><span class="lab">Обращения ↔ Отток</span><span class="track"><span class="bar"></span></span><span class="val"></span></div>
    <div class="row"><span class="lab">Ошибки ↔ Обращения</span><span class="track"><span class="bar"></span></span><span class="val"></span></div>
    <div class="row"><span class="lab">Ошибки ↔ Отток</span><span class="track"><span class="bar"></span></span><span class="val"></span></div>
    <div class="row"><span class="lab">Частная корреляция обращений и оттока</span><span class="track"><span class="bar"></span></span><span class="val"></span></div>
  </div>
</div>
<div class="card">
  <table>
    <thead>
      <tr><th>Неделя</th><th>Обращения</th><th>Отток</th><th>Ошибка</th></tr>
    </thead>
    <tbody id="dataTableBody"></tbody>
  </table>
</div>
<div class="card">
  <h2>Вывод</h2>
  <p id="conclusion"></p>
</div>
<script src="weekly_ops_26w.js"></script>
<script>
function formatNum(num) {
  if (!Number.isFinite(num)) return num;
  const rounded = num.toFixed(Math.abs(num) >= 1 ? 1 : 2);
  return rounded.replace('.', ',');
}

// Основная обработка начинается здесь
if (typeof window.DATA !== 'undefined') {
  // Извлекаем ряды данных
  let calls = DATA.map(d => d.calls_th).filter(Number.isFinite),
      churn = DATA.map(d => d.churn_pct).filter(Number.isFinite),
      errors = DATA.map(d => d.app_error_rate_pct).filter(Number.isFinite);
  
  function mean(arr) {
    return arr.reduce((acc, val) => acc + val, 0) / arr.length;
  }

  function median(arr) {
    const sorted = arr.slice().sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }

  function mad(arr) {
    const med = median(arr);
    return median(arr.map(val => Math.abs(val - med)));
  }

  function percentile(arr, p) {
    const sorted = arr.slice().sort((a, b) => a - b);
    const index = ((arr.length - 1) * p / 100).toFixed(1);
    const lower = Math.floor(index);
    const upper = Math.ceil(index);
    if (lower === upper) return sorted[lower];
    return sorted[lower] + (index - lower) * (sorted[upper] - sorted[lower]);
  }

  function pearsonCorrelation(x, y) {
    const mx = mean(x), my = mean(y);
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < x.length; i++) {
      const dx = x[i] - mx, dy = y[i] - my;
      sxy += dx * dy;
      sxx += dx * dx;
      syy += dy * dy;
    }
    return sxy / Math.sqrt(sxx * syy);
  }

  // Корреляционные расчеты
  const corrCallsChurn = pearsonCorrelation(calls, churn),
        corrErrorsCalls = pearsonCorrelation(errors, calls),
        corrErrorsChurn = pearsonCorrelation(errors, churn),
        partialCorrCallsChurn = (corrCallsChurn - corrErrorsCalls * corrErrorsChurn) /
                                Math.sqrt((1 - corrErrorsCalls ** 2) * (1 - corrErrorsChurn ** 2));

  // Выводим результаты
  document.getElementById('corrcallschurn').innerHTML = `${formatNum(corrCallsChurn)}<br/><span class="small">Корреляция обращений и оттока</span>`;
  document.getElementById('correrrorscalls').innerHTML = `${formatNum(corrErrorsCalls)}<br/><span class="small">Корреляция ошибок и обращений</span>`;
  document.getElementById('correrrorschurn').innerHTML = `${formatNum(corrErrorsChurn)}<br/><span class="small">Корреляция ошибок и оттока</span>`;
  document.getElementById('partialcorrcallschurn').innerHTML = `${formatNum(partialCorrCallsChurn)}<br/><span class="small">Частная корреляция обращений и оттока</span>`;

  // Рисуем графики
  const chart = document.getElementById('chart'),
        cMaxX = 784, cMinY = 16, cMaxY = 250,
        gridLinesY = [cMinY, 74.5, 133, 191.5, cMaxY],
        col1Max = Math.max(...calls), col2Max = Math.max(...churn), col3Max = Math.max(...errors);

  const rows = [];
  DATA.forEach((d, idx) => {
    const callVal = d.calls_th / col1Max,
          churnVal = d.churn_pct / col2Max,
          errorVal = d.app_error_rate_pct / col3Max;
    
    const pointCall = `${(52 + idx * 732 / 25).toFixed(1)},${(250 - callVal * 234).toFixed(1)}`,
          pointChurn = `${(52 + idx * 732 / 25).toFixed(1)},${(250 - churnVal * 234).toFixed(1)}`,
          pointError = `${(52 + idx * 732 / 25).toFixed(1)},${(250 - errorVal * 234).toFixed(1)}`;
          
    rows.push(pointCall, pointChurn, pointError);
  });

  const pointsStr = rows.join(' ');

  const legendText = `<text x="10" y="30" font-size="14" fill="#20BA72">Обращения</text>` +
                    `<text x="10" y="50" font-size="14" fill="#2E6BE6">Отток</text>` +
                    `<text x="10" y="70" font-size="14" fill="#E4572E">Ошибка</text>`;

  const polylineMarkup = `<polyline fill="none" stroke="#20BA72" stroke-width="2" points="${pointsStr.split(',')[0].split(' ').slice(0, 26).join(', ')}"/>` +
                         `<polyline fill="none" stroke="#2E6BE6" stroke-width="2" points="${pointsStr.split(',')[0].split(' ').slice(26, 52).join(', ')}"/>` +
                         `<polyline fill="none" stroke="#E4572E" stroke-width="2" points="${pointsStr.split(',')[0].split(' ').slice(52, 78).join(', ')}"/>`;

  const gridLines = gridLinesY.map(y => `<line x1="52" x2="784" y1="${y}" y2="${y}" stroke="#e6ecf1"/>`).join('');

  chart.innerHTML = `
    ${legendText}
    ${gridLines}
    ${polylineMarkup}
  `;

  // Формирование таблицы
  const dataTableBody = document.getElementById('dataTableBody');
  DATA.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${row.week_start}</td>
      <td>${formatNum(row.calls_th)}</td>
      <td>${formatNum(row.churn_pct)}</td>
      <td>${formatNum(row.app_error_rate_pct)}</td>
    `;
    dataTableBody.appendChild(tr);
  });

  // Полосы
  const rowElements = document.querySelectorAll('.row');
  const absVals = [Math.abs(corrCallsChurn), Math.abs(corrErrorsCalls), Math.abs(corrErrorsChurn), Math.abs(partialCorrCallsChurn)];
  const maxAbsVal = Math.max(...absVals);
  absVals.forEach((v, i) => {
    const width = (100 * v / maxAbsVal).toFixed(1) + '%';
    rowElements[i].querySelector('.bar').style.width = width;
    rowElements[i].querySelector('.val').textContent = formatNum(absVals[i]);
  });

  // Вывод итогового заключения
  document.getElementById('conclusion').textContent = 
    `Коэффициент частной корреляции (${formatNum(partialCorrCallsChurn)}) показывает слабую взаимосвязь обращений и оттока клиентов вне зависимости от уровня технических проблем.`;
} else {
  document.body.textContent = 'Файл weekly_ops_26w.js должен лежать рядом со страницей.';
}
</script>
</body>
</html>
