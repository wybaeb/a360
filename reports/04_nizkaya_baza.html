<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчет по ипотечному рынку</title>
<style>
body { font-family: Arial, sans-serif; }
h1,h2 { color: #333; margin-bottom: 1em; }
table { width: 100%; border-collapse: collapse; margin-top: 1em; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
th { background-color: #f2f2f2; }
.track{display:inline-block;width:320px;height:14px;background:#eef2f5;border-radius:7px;vertical-align:middle;}
.bar{display:block;height:14px;background:#20BA72;border-radius:7px;}
.row{display:flex;align-items:center;gap:12px;margin:6px 0;}
.error { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>Низкая база: проценты без базы ничего не значат</h1>
<p>Проверяем изменение выдачи ипотеки игроками рынка за год.</p>
<div id="charts"></div>
<div id="output-table"></div>
<div id="conclusion"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('../data/mortgage_market.csv');
        if (!response.ok) throw new Error(`Ошибка HTTP ${response.status}`);
        
        const csvText = await response.text();
        const rows = csvText.trim().split("\n").slice(1); // пропускаем заголовки

        let data = [];
        for (let row of rows) {
            const cols = row.split(',').map(c => c.trim());
            if (cols.length !== 3 || isNaN(parseFloat(cols[1])) || isNaN(parseFloat(cols[2])))
                continue;
            
            data.push({
                bank: cols[0],
                was_bn_rub: parseFloat(cols[1]),
                now_bn_rub: parseFloat(cols[2])
            });
        }
    
        const totalBefore = data.reduce((acc, d) => acc + d.was_bn_rub, 0);
        const totalAfter = data.reduce((acc, d) => acc + d.now_bn_rub, 0);
    
        data.forEach(d => {
            d.growth_rate = ((d.now_bn_rub / d.was_bn_rub - 1) * 100).toFixed(1);
            d.absolute_growth = (d.now_bn_rub - d.was_bn_rub).toFixed(1);
            d.share_before = ((d.was_bn_rub / totalBefore * 100)).toFixed(1);
            d.share_after = ((d.now_bn_rub / totalAfter * 100)).toFixed(1);
            d.share_change = (parseFloat(d.share_after) - parseFloat(d.share_before)).toFixed(1);
        });
    
        const growthRates = data.map(d => parseFloat(d.growth_rate));
        const absoluteGrowths = data.map(d => parseFloat(d.absolute_growth));
        const maxRateAbs = Math.max(...growthRates.map(Math.abs));
        const maxAbsoluteGrowthAbs = Math.max(...absoluteGrowths.map(Math.abs));
    
        document.getElementById('charts').innerHTML += `
            <h2>Темпы роста выдач (%):</h2>
            ${data.map(d => `<div class="row"><span class="lab">${d.bank}</span><span class="track"><span class="bar" style="width:${(100*Math.abs(growthRates.find(r=>r==d.growth_rate))/maxRateAbs).toFixed(1)}%"></span></span><span class="val">${d.growth_rate}%</span></div>`).join('')}
            <h2>Абсолютный рост выдач (млрд руб.):</h2>
            ${data.map(d => `<div class="row"><span class="lab">${d.bank}</span><span class="track"><span class="bar" style="width:${(100*Math.abs(absoluteGrowths.find(r=>r==d.absolute_growth))/maxAbsoluteGrowthAbs).toFixed(1)}%"></span></span><span class="val">${d.absolute_growth.replace('.', ',')}</span></div>`).join('')}
        `;
    
        document.getElementById('output-table').innerHTML += `
            <h2>Изменение долей рынка:</h2>
            <table>
              <tr><th>Игрок</th><th>Было (млрд)</th><th>Стало (млрд)</th><th>Темп роста (%)</th><th>Прирост (млрд)</th><th>Доля была (%)</th><th>Доля стала (%)</th><th>Изменение доли (пп)</th></tr>
              ${data.map(d => `<tr><td>${d.bank}</td><td>${d.was_bn_rub.toFixed(1).replace('.', ',')}</td><td>${d.now_bn_rub.toFixed(1).replace('.', ',')}</td><td>${d.growth_rate}%</td><td>${d.absolute_growth.replace('.', ',')}</td><td>${d.share_before}%</td><td>${d.share_after}%</td><td>${d.share_change} п.п.</td></tr>`).join('')}
            </table>
        `;
    
        document.getElementById('conclusion').innerHTML += `
            <h2>Вывод:</h2>
            Рынок вырос на ${((totalAfter - totalBefore)/totalBefore*100).toFixed(1)}%. 
            Лидеры сохранили позиции: наибольший абсолютный прирост показала компания ${data.sort((a,b)=>b.absolute_growth-a.absolute_growth)[0].bank}, достигнув увеличения на ${data.sort((a,b)=>b.absolute_growth-a.absolute_growth)[0].absolute_growth.replace('.',',')} млрд руб., что составило ${data.sort((a,b)=>b.absolute_growth-a.absolute_growth)[0].share_change}% пунктов рыночной доли.<br/>
            Изменения доли менее 5% процентов не считаются существенными.
        `;
    } catch(err) {
        document.body.innerHTML = '<p class="error">' + err.message + '</p>';
    }
});
</script>
</body>
</html>
