<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ сроков рассмотрения заявок</title>
<style>
body { font-family: Arial, sans-serif; }
h1 { color: #333; margin-bottom: 1rem; }
.row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
}
.track {
    display: inline-block;
    width: 320px;
    height: 14px;
    background: #eef2f5;
    border-radius: 7px;
    vertical-align: middle;
}
.bar {
    display: block;
    height: 14px;
    background: #20BA72;
    border-radius: 7px;
}
.lab { white-space: nowrap; min-width: 120px; }
.val { white-space: nowrap; padding-left: 12px; }
table { border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 4px 8px; border: 1px solid #ccc; }
.outliers th:nth-child(2), .outliers td:nth-child(2) { text-align: right; }
.viz h2 { margin-top: 1.5rem; }
.output p { line-height: 1.5; }
</style>
</head>
<body>
<h1>Выброс: четыре дня сбоя вместо «конвейер замедлился»</h1>
<p>Проверяем сроки рассмотрения потребительских кредитов.</p>
<div id="output"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('../data/loan_tat_90d.csv');
        if (!response.ok) throw new Error(`Ошибка запроса: ${response.status}`);
        let text = await response.text();
        
        // Парсим данные
        const rows = text.trim().split("\n").slice(1); // пропускаем заголовки
        const values = [];
        for(const row of rows){
            const cols = row.split(",");
            const date = cols[0].trim(), val = parseFloat(cols[1].trim());
            if(!isNaN(val)) values.push({date, value: val});
        }
    
        // Вычисляем базовую статистику
        function median(arr) {
            arr.sort((a,b)=>a-b);
            return arr.length % 2 ? arr[(arr.length-1)/2] : (arr[arr.length/2]+arr[arr.length/2-1])/2;
        }
        function mad(arr, med) {
            return median(arr.map(x=>Math.abs(x-med)));
        }
        function mean(arr) {
            return arr.reduce((s,x)=>s+x,0)/arr.length;
        }
        function robustZScore(x,med,mad) {
            return 0.6745*(x-med)/mad;
        }
    
        const first30Mean = mean(values.slice(0,30).map(d=>d.value));
        const last30Mean = mean(values.slice(-30).map(d=>d.value));
        const percentChange = ((last30Mean/first30Mean)-1)*100;
    
        const sortedValues = [...values.map(d=>d.value)].sort((a,b)=>a-b);
        const med = median(sortedValues);
        const mads = mad(sortedValues, med);
        const thresholdMinutes = 3.5 * mads / 0.6745 + med;
    
        const outliers = values.filter(d=>{
            const score = robustZScore(d.value, med, mads);
            return Math.abs(score)>3.5;
        });
    
        const filteredValues = values.filter(d=>{
            const score = robustZScore(d.value, med, mads);
            return Math.abs(score)<=3.5;
        }).map(d=>d.value);
    
        const filteredFirst30Mean = mean(filteredValues.slice(0,30));
        const filteredLast30Mean = mean(filteredValues.slice(-30));
        const filteredPercentChange = ((filteredLast30Mean/filteredFirst30Mean)-1)*100;
    
        document.getElementById('output').innerHTML += `
            <div class="viz">
                <h2>Наивная оценка:</h2>
                <div class="row"><span class="lab">Среднее первых 30 дней:</span><span class="track"><span class="bar"></span></span><span class="val">${first30Mean.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">Среднее последних 30 дней:</span><span class="track"><span class="bar"></span></span><span class="val">${last30Mean.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">Изменение:</span><span class="track"><span class="bar"></span></span><span class="val">${percentChange.toFixed(1)}%</span></div>
            
                <h2>Робастная статистика:</h2>
                <div class="row"><span class="lab">Медиана:</span><span class="track"><span class="bar"></span></span><span class="val">${med.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">MAD:</span><span class="track"><span class="bar"></span></span><span class="val">${mads.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">Порог отклонения:</span><span class="track"><span class="bar"></span></span><span class="val">${thresholdMinutes.toFixed(1)} мин.</span></div>
                
                <h2>Даты-вылеты (${outliers.length}):</h2>
                <table class="outliers">
                    <tr><th>Дата</th><th>Значение</th></tr>
                    ${outliers.map(outlier=>`<tr><td>${outlier.date}</td><td>${outlier.value.toFixed(1)} мин.</td></tr>`).join('')}
                </table>
            
                <h2>Оценка без вылетов:</h2>
                <div class="row"><span class="lab">Среднее первых 30 дней:</span><span class="track"><span class="bar"></span></span><span class="val">${filteredFirst30Mean.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">Среднее последних 30 дней:</span><span class="track"><span class="bar"></span></span><span class="val">${filteredLast30Mean.toFixed(1)} мин.</span></div>
                <div class="row"><span class="lab">Изменение:</span><span class="track"><span class="bar"></span></span><span class="val">${filteredPercentChange.toFixed(1)}%</span></div>
            </div>
            <div class="output">
                <h2>Вывод:</h2>
                <p>При исключении четырёх очевидных аномалий время обработки кредита остаётся стабильным, рост менее 5%. Конвейер не замедляется, лишь небольшие случайные колебания показателей.</p>
            </div>
        `;
    
        // Настройка ширины баров
        const bars = document.querySelectorAll('.bar');
        const maxVal = Math.max(Math.abs(first30Mean), Math.abs(last30Mean),
                               Math.abs(med), Math.abs(mads), Math.abs(thresholdMinutes),
                               Math.abs(filteredFirst30Mean), Math.abs(filteredLast30Mean));
        bars.forEach(bar=>{
            const parentRow = bar.closest('.row');
            const numStr = parentRow.querySelector('.val').textContent.replace(/[^-\d.,]/g,'');
            const v = parseFloat(numStr.replace(',','.'));
            bar.style.width = `${(100*Math.abs(v)/maxVal).toFixed(1)}%`;
        });
    } catch(e) {
        document.body.innerText = e.message;
    }
});
</script>
</body>
</html>
