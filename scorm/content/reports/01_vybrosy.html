<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчет по срокам рассмотрения заявок</title>
<style>
body {
  background-color: white;
  color: #2E3641;
  font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  margin: 0 auto;
  padding: 20px;
  max-width: 920px;
}
h1 {font-size: 24px;}
p {color: #6B7C93; line-height: 1.6em;}
.card {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border: 1px solid #e6ecf1;
  border-radius: 14px;
  box-shadow: 0 2px 4px rgba(0,0,0,.05);
  margin-bottom: 16px;
}
/* Карточки, внутри которых блоки идут сверху вниз: полосы «до / после очистки»,
   таблица выбросов и вывод. Без этого четыре строки .row встают в один ряд,
   и полосы «После очистки» уходят за правый край страницы — из разбора пропадает
   ровно та половина, ради которой он и сделан. */
#bars, #outliers-table, #conclusion {display: block;}
/* Таблица выбросов шире узкого экрана: прокручиваем её внутри карточки,
   а не всю страницу. */
#outliers-table {width: auto; overflow-x: auto;}
#outliers-table table {width: 100%;}
.kpi-tile {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  border-right: 1px solid #e6ecf1;
  vertical-align: top;
  text-align: center;
  font-weight: bold;
  box-sizing: border-box;
  flex: 1 1 120px;
}
.kpi-tile:last-child {border-right: none;}
.num {font-size: 32px; color: #2E3641;}
.label {font-size: 12px; color: #8A94A0; margin-top: 4px;}
.graph {
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
}
.table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 16px;
}
th, td {padding: 8px; border: 1px solid #e6ecf1; text-align: left;}
th {background-color: #F6FAFE;}
.track{display:inline-block;width:320px;height:14px;background:#EEF2F5;border-radius:7px;vertical-align:middle}
.bar{display:block;height:14px;background:#20BA72;border-radius:7px}
.row{display:flex;align-items:center;gap:12px;margin:6px 0}
.conclusion {font-style: italic; color: #6B7C93;}
</style>
</head>
<body>
<h1>Выброс: четыре дня сбоя вместо «конвейер замедлился»</h1>
<p>Проверяем наличие выбросов в сроках рассмотрения кредитных заявок.</p>
<div id="kpis" class="card"></div>
<div id="graph" class="graph"></div>
<div id="bars" class="card"></div>
<div id="outliers-table" class="table card"></div>
<div id="conclusion" class="card conclusion"></div>
<script src="loan_tat_90d.js"></script>
<script>
if (!window.DATA || !Array.isArray(window.DATA)) {
  document.body.innerText = "Ошибка: файл loan_tat_90d.js должен лежать рядом со страницей.";
} else {
function formatNum(num) {
  if (typeof num !== 'number' || !Number.isFinite(num)) return num;
  return num.toFixed(1).replace('.', ',');
}
// Число → проценты
function pctChange(oldVal, newVal) {
  const change = ((newVal / oldVal) - 1) * 100;
  return `${change >= 0 ? '+' : ''}${formatNum(change)}%`;
}
// Среднее арифметическое
function mean(arr) {
  return arr.reduce((acc, val) => acc + val, 0) / arr.length;
}
// Медиана
function median(arr) {
  const sortedArr = arr.slice().sort((a, b) => a - b);
  const midIndex = Math.floor(sortedArr.length / 2);
  return sortedArr.length % 2 === 0 ?
    (sortedArr[midIndex - 1] + sortedArr[midIndex]) / 2 :
    sortedArr[midIndex];
}
// Медиана абсолютных отклонений (MAD)
function mad(arr, med) {
  return median(arr.map(val => Math.abs(val - med)));
}
// Робастная Z-оценка
const robZScoreFactor = 0.6745;
function robustZScore(value, medianValue, madValue) {
  return robZScoreFactor * (value - medianValue) / madValue;
}
// Порог отклонения (модуль > 3.5)
const thresholdMultiple = 3.5;
// Строки и ряды данных
var dates = window.DATA.map(r => r.date);
var values = window.DATA.map(r => r.tat_min).filter(Number.isFinite);
var firstHalfMean = mean(values.slice(0, 30));
var lastHalfMean = mean(values.slice(-30));
var totalMedian = median(values);
var totalMad = mad(values, totalMedian);
var outlierThreshold = totalMedian + thresholdMultiple * totalMad / robZScoreFactor;
// Выявление выбросов
let outliers = [];
for (let i = 0; i < values.length; ++i) {
  let score = robustZScore(values[i], totalMedian, totalMad);
  if (Math.abs(score) > thresholdMultiple) {
    outliers.push({date: dates[i], value: values[i], zscore: score});
  }
}
// Обновлённые ряды без выбросов
values = values.filter((_, idx) => !outliers.some(outl => outl.value === values[idx]));
dates = dates.filter((_, idx) => !outliers.some(outl => outl.value === values[idx]));
firstHalfMeanCleaned = mean(values.slice(0, 30));
lastHalfMeanCleaned = mean(values.slice(-30));
// Основные показатели
document.getElementById('kpis').innerHTML = `
  <div class="kpi-tile"><div class="num">${formatNum(firstHalfMean)}</div><div class="label">Средние первые 30 дней</div></div>
  <div class="kpi-tile"><div class="num">${formatNum(lastHalfMean)}</div><div class="label">Средние последние 30 дней</div></div>
  <div class="kpi-tile"><div class="num">${pctChange(firstHalfMean, lastHalfMean)}</div><div class="label">Изменение</div></div>
  <div class="kpi-tile"><div class="num">${formatNum(totalMedian)}</div><div class="label">Медиана</div></div>
  <div class="kpi-tile"><div class="num">${formatNum(totalMad)}</div><div class="label">MAD</div></div>
  <div class="kpi-tile"><div class="num">${formatNum(outlierThreshold)}</div><div class="label">Порог выброса</div></div>
  <div class="kpi-tile"><div class="num">${pctChange(firstHalfMeanCleaned, lastHalfMeanCleaned)}</div><div class="label">Изменение после очистки</div></div>
`;
// Диаграмма
let minY = Math.min(...values);
let maxY = Math.max(...values);
if (minY === maxY) maxY += 1;
let dataPoints = values.map((v, i) => [52 + i * 732 / (values.length - 1), 250 - (v - minY) * 234 / (maxY - minY)]);
dataPoints.forEach(dp => dp.forEach(c => c = Math.round(c)));
let plotLines = `<polyline fill="none" stroke="#20BA72" stroke-width="2" points="${dataPoints.map(p => p.join(',')).join(' ')}"/>`;
let thresholdLine = `<line x1="52" y1="${250 - (outlierThreshold - minY) * 234 / (maxY - minY)}" x2="784" y2="${250 - (outlierThreshold - minY) * 234 / (maxY - minY)}" stroke="#E4572E" stroke-dasharray="5 4"/>
<text x="784" y="${250 - (outlierThreshold - minY) * 234 / (maxY - minY) - 6}" text-anchor="end" font-size="11" fill="#8A94A0">порог (${formatNum(outlierThreshold)})</text>`;
let gridLines = '<line x1="52" x2="784" y1="16" y2="16" stroke="#e6ecf1"/>' +
                '<line x1="52" x2="784" y1="74.5" y2="74.5" stroke="#e6ecf1"/>' +
                '<line x1="52" x2="784" y1="133" y2="133" stroke="#e6ecf1"/>' +
                '<line x1="52" x2="784" y1="191.5" y2="191.5" stroke="#e6ecf1"/>' +
                '<line x1="52" x2="784" y1="250" y2="250" stroke="#e6ecf1"/>';
let axisLabels = `<text x="46" y="12" text-anchor="end" font-size="11" fill="#8A94A0">${formatNum(maxY)}</text>` +
                 `<text x="46" y="256" text-anchor="end" font-size="11" fill="#8A94A0">${formatNum(minY)}</text>` +
                 `<text x="52" y="266" font-size="11" fill="#8A94A0">${dates[0].slice(5)}</text>` +
                 `<text x="784" y="266" text-anchor="end" font-size="11" fill="#8A94A0">${dates[dates.length-1].slice(5)}</text>`;
let circles = outliers.map(outl => `<circle cx="${52 + dates.indexOf(outl.date)*732/(dates.length-1)}" cy="${250-(outl.value-minY)*234/(maxY-minY)}" r="4" fill="#E4572E"/>`).join('');
document.getElementById('graph').innerHTML = `<svg viewBox="0 0 800 280" style="width:100%;height:auto;display:block;">${gridLines}${plotLines}${thresholdLine}${axisLabels}${circles}</svg>`;
// Горизонтальные полоски сравнения
let maxBar = Math.max(Math.abs(firstHalfMean), Math.abs(lastHalfMean),
                      Math.abs(firstHalfMeanCleaned), Math.abs(lastHalfMeanCleaned));
document.getElementById('bars').innerHTML = `
<div class="row"><span class="lab">Первые 30 дней</span>
<span class="track"><span class="bar" style="width:${(100*Math.abs(firstHalfMean)/maxBar).toFixed(1)}%"></span></span>
<span class="val">${formatNum(firstHalfMean)} мин</span></div>
<div class="row"><span class="lab">Последние 30 дней</span>
<span class="track"><span class="bar" style="width:${(100*Math.abs(lastHalfMean)/maxBar).toFixed(1)}%"></span></span>
<span class="val">${formatNum(lastHalfMean)} мин</span></div>
<div class="row"><span class="lab">После очистки: первые 30 дней</span>
<span class="track"><span class="bar" style="width:${(100*Math.abs(firstHalfMeanCleaned)/maxBar).toFixed(1)}%"></span></span>
<span class="val">${formatNum(firstHalfMeanCleaned)} мин</span></div>
<div class="row"><span class="lab">После очистки: последние 30 дней</span>
<span class="track"><span class="bar" style="width:${(100*Math.abs(lastHalfMeanCleaned)/maxBar).toFixed(1)}%"></span></span>
<span class="val">${formatNum(lastHalfMeanCleaned)} мин</span></div>
`;
// Таблица дней-выбросов
document.getElementById('outliers-table').innerHTML = `
<table>
<tr><th>Дата</th><th>Значение, мин</th><th>Робастная Z-оценка</th></tr>
${outliers.map(outl => `<tr><td>${outl.date}</td><td>${formatNum(outl.value)}</td><td>${formatNum(outl.zscore)}</td></tr>`).join('')}
</table>
`;
// Вывод
document.getElementById('conclusion').innerHTML = `
Изначально средняя продолжительность обработки заявок увеличилась на ${pctChange(firstHalfMean, lastHalfMean)}, однако после выявления и исключения четырёх критичных дней скорость вернулась почти к прежним показателям (+/-5%). Это значит, что ухудшение связано с временными сбоями, а не устойчивым снижением качества работы.
`;
}
</script>
</body>
</html>
