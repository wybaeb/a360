<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общая причина: два показателя растут вместе, но не влияют друг на друга</title>
<style>
  body{margin:0;background:#fff;color:#2E3641;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px}
  h1{font-size:24px;margin:0 0 6px} h3{margin:0 0 10px}
  .sub{color:#6B7580;margin:0 0 20px}
  .card{border:1px solid #e6ecf1;border-radius:14px;padding:18px;margin:0 0 16px}
  .tiles{display:flex;flex-wrap:wrap;gap:18px}
  .tile .num{font-size:32px;font-weight:700} .tile .lab{color:#6B7580;font-size:13px}
  .row{display:flex;align-items:center;gap:12px;margin:6px 0}
  .lab{width:190px;font-size:14px;flex:none} .val{font-weight:600;font-size:14px}
  .track{display:inline-block;width:320px;max-width:44vw;height:14px;
         background:#eef2f5;border-radius:7px}
  .bar{display:block;height:14px;background:#20BA72;border-radius:7px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{border-bottom:1px solid #e6ecf1;padding:7px 9px;text-align:left}
  .scroll{overflow-x:auto} .warn{color:#E4572E}
  svg{width:100%;height:auto;display:block}
</style></head><body><div class="wrap">
<h1>Общая причина: два показателя растут вместе, но не влияют друг на друга</h1><p class="sub" id="subtitle"></p>
<div id="report"><p class="warn" id="status">Загружаю данные и расчёт…</p></div>
</div>
<script>
// ── Готовые функции отрисовки. Файл менять не нужно. ───────────────────────
function fmt(v, k) {
  if (!Number.isFinite(v)) return String(v);
  return v.toFixed(k === undefined ? 1 : k).replace(".", ",");
}
function setSubtitle(t) { document.getElementById("subtitle").textContent = t; }
function card(heading, inner) {
  return '<div class="card"><h3>' + heading + '</h3>' + inner + '</div>';
}
function tiles(items) {
  return '<div class="tiles">' + items.map(function(p) {
    return '<div class="tile"><div class="num">' + p[0] +
           '</div><div class="lab">' + p[1] + '</div></div>';
  }).join('') + '</div>';
}
function chartLine(values, labels, highlights) {
  var v = values.filter(Number.isFinite), n = values.length;
  if (!v.length) return '<p>нет данных</p>';
  var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
  if (max === min) max = min + 1;
  var x = function(i) { return (52 + i * 732 / Math.max(1, n - 1)).toFixed(1); };
  var y = function(v) { return (250 - (v - min) * 234 / (max - min)).toFixed(1); };
  var s = '<svg viewBox="0 0 800 285">';
  [16, 74.5, 133, 191.5, 250].forEach(function(g) {
    s += '<line x1="52" x2="784" y1="' + g + '" y2="' + g + '" stroke="#e6ecf1"/>';
  });
  s += '<text x="46" y="20" text-anchor="end" font-size="11" fill="#8a94a0">' +
       fmt(max) + '</text><text x="46" y="252" text-anchor="end" font-size="11" ' +
       'fill="#8a94a0">' + fmt(min) + '</text>';
  var pts = [];
  values.forEach(function(v, i) {
    if (Number.isFinite(v)) pts.push(x(i) + ',' + y(v));
  });
  s += '<polyline fill="none" stroke="#20BA72" stroke-width="2" points="' +
       pts.join(' ') + '"/>';
  (highlights || []).forEach(function(i) {
    if (Number.isFinite(values[i]))
      s += '<circle cx="' + x(i) + '" cy="' + y(values[i]) +
           '" r="5" fill="#E4572E"/>';
  });
  if (labels && labels.length) {
    s += '<text x="52" y="278" font-size="11" fill="#8a94a0">' + labels[0] +
         '</text><text x="784" y="278" text-anchor="end" font-size="11" ' +
         'fill="#8a94a0">' + labels[labels.length - 1] + '</text>';
  }
  return s + '</svg>';
}
function chartBars(values, labels) {
  var v = values.filter(Number.isFinite), n = values.length;
  if (!v.length) return '<p>нет данных</p>';
  var max = Math.max.apply(null, v); if (max <= 0) max = 1;
  var w = 732 / n * 0.8;
  var s = '<svg viewBox="0 0 800 285">';
  [16, 74.5, 133, 191.5, 250].forEach(function(g) {
    s += '<line x1="52" x2="784" y1="' + g + '" y2="' + g + '" stroke="#e6ecf1"/>';
  });
  s += '<text x="46" y="20" text-anchor="end" font-size="11" fill="#8a94a0">' +
       fmt(max) + '</text>';
  values.forEach(function(v, i) {
    if (!Number.isFinite(v)) return;
    var h = Math.max(0, v * 234 / max);
    var xx = (52 + i * 732 / n + (732 / n - w) / 2).toFixed(1);
    s += '<rect x="' + xx + '" y="' + (250 - h).toFixed(1) + '" width="' +
         w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="#20BA72" rx="2"/>';
  });
  if (labels && labels.length) {
    s += '<text x="52" y="278" font-size="11" fill="#8a94a0">' + labels[0] +
         '</text><text x="784" y="278" text-anchor="end" font-size="11" ' +
         'fill="#8a94a0">' + labels[labels.length - 1] + '</text>';
  }
  return s + '</svg>';
}
function barRows(items) {
  var max = Math.max.apply(null, items.map(function(p) {
    return Math.abs(p[1]);
  }).filter(Number.isFinite));
  if (!Number.isFinite(max) || max <= 0) max = 1;
  return items.map(function(p) {
    var w = (100 * Math.abs(p[1]) / max).toFixed(1) + '%';
    return '<div class="row"><span class="lab">' + p[0] +
           '</span><span class="track"><span class="bar" style="width:' + w +
           '"></span></span><span class="val">' + p[2] + '</span></div>';
  }).join('');
}
function makeTable(headers, rows) {
  return '<div class="scroll"><table><tr>' + headers.map(function(h) {
    return '<th>' + h + '</th>';
  }).join('') + '</tr>' + rows.map(function(r) {
    return '<tr>' + r.map(function(c) {
      return '<td>' + c + '</td>';
    }).join('') + '</tr>';
  }).join('') + '</table></div>';
}
function median(v) {
  var s = v.slice().sort(function(a, b) { return a - b; });
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function percentile(v, p) {
  var s = v.slice().sort(function(a, b) { return a - b; });
  var pos = (s.length - 1) * p / 100, lo = Math.floor(pos);
  return lo + 1 < s.length ? s[lo] + (pos - lo) * (s[lo + 1] - s[lo]) : s[lo];
}
function correlation(x, y) {
  var n = Math.min(x.length, y.length), mx = 0, my = 0, i;
  for (i = 0; i < n; i++) { mx += x[i]; my += y[i]; }
  mx /= n; my /= n;
  var sxy = 0, sxx = 0, syy = 0;
  for (i = 0; i < n; i++) {
    sxy += (x[i] - mx) * (y[i] - my);
    sxx += (x[i] - mx) * (x[i] - mx);
    syy += (y[i] - my) * (y[i] - my);
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
}
</script>
