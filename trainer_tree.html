<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: Дерево метрик · Аналитика 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS — change these to rebrand ===== */
:root {
  --bg:             #f2f7f4;
  --bg-surface:     #ffffff;
  --bg-elevated:    #eef5f1;
  --bg-hover:       #e3efe8;
  --text:           #10281c;
  --text-sec:       rgba(16,40,28,.64);
  --text-muted:     rgba(16,40,28,.38);
  --accent:         #20BA72;
  --accent-hover:   #17a563;
  --color-leading:  #20BA72;
  --color-calc:     #2E6BB8;
  --color-lagging:  #D9822B;
  --bg-leading:     rgba(32,186,114,.10);
  --bg-calc:        rgba(46,107,184,.10);
  --bg-lagging:     rgba(217,130,43,.12);
  --ok:             #0f7a46;
  --warn:           #b07708;
  --err:            #C4453B;
  --info:           #2E6BB8;
  --edge-color:     #5c7268;
  --node-w:         194px;
  --port-r:         7px;
  --radius:         12px;
  --radius-sm:      8px;
  --font:           'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}

/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100vh}
.header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg-surface);border-bottom:1px solid rgba(16,40,28,.06);flex-shrink:0}
.header-brand{display:flex;align-items:baseline;gap:8px}
.header-title{font-size:16px;font-weight:700}
.header-tag{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.case-select{background:var(--bg-elevated);color:var(--text);border:1px solid rgba(16,40,28,.1);border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;font-family:var(--font);cursor:pointer;min-width:240px}
.case-select:focus{outline:2px solid var(--accent);outline-offset:-2px}
.case-select option{background:var(--bg-surface);color:var(--text)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text-sec);margin-left:auto}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.case-bar{padding:6px 20px 8px;font-size:12px;color:var(--text-sec);background:var(--bg);border-bottom:1px solid rgba(16,40,28,.04);flex-shrink:0;line-height:1.4}
.case-bar .dir-hint{color:var(--text-muted)}

.workspace{display:flex;flex:1;overflow:hidden}

/* ===== PALETTE ===== */
.palette{width:260px;background:var(--bg-surface);border-right:1px solid rgba(16,40,28,.06);overflow-y:auto;padding:12px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--bg-elevated) transparent}
.pal-section{margin-bottom:16px}
.pal-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;margin-bottom:6px;border-radius:4px}
.pal-title.leading{color:var(--color-leading);background:var(--bg-leading)}
.pal-title.calc{color:var(--color-calc);background:var(--bg-calc)}
.pal-title.lagging{color:var(--color-lagging);background:var(--bg-lagging)}
.pal-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:grab;transition:background .15s;margin-bottom:3px}
.pal-card:hover{background:var(--bg-elevated)}
.pal-card.used{opacity:.3;pointer-events:none;cursor:default}
.pal-card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pal-card-name{font-size:12px;font-weight:600;line-height:1.2}
.pal-card-abbr{font-size:10px;color:var(--text-sec)}
@keyframes hint-flash{0%,100%{background:transparent}50%{background:rgba(255,85,51,.2)}}
.pal-card.hint{animation:hint-flash .45s ease 3}

/* ===== CANVAS ===== */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px,rgba(16,40,28,.025) 1px,transparent 0) 0 0/24px 24px}
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--text-muted);font-size:14px;pointer-events:none;z-index:0;line-height:1.6;transition:opacity .3s}
.canvas-hint svg{margin-bottom:8px;opacity:.3}
.edge-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.edge-hit{pointer-events:all;cursor:pointer;stroke-linecap:round}
.edge-line{transition:stroke .15s,stroke-width .15s,filter .15s}
.edge-group:hover .edge-line{stroke:var(--accent);stroke-width:2.5}
.edge-group.selected .edge-line{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 6px rgba(255,85,51,.5))}
.edge-group.correct .edge-line{stroke:var(--ok);stroke-width:2.5}
.edge-group.invalid .edge-line{stroke:var(--err);stroke-width:2.5;stroke-dasharray:6 3}
.temp-edge{stroke-dasharray:8 4;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}

.node-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.node{pointer-events:all}

/* ===== NODES ===== */
.node{position:absolute;width:var(--node-w);background:var(--bg-surface);border-radius:var(--radius-sm);box-shadow:0 2px 12px rgba(0,0,0,.25);cursor:grab;user-select:none;z-index:2;transition:box-shadow .15s,outline-color .15s;outline:2px solid transparent;outline-offset:2px}
.node:hover{box-shadow:0 4px 20px rgba(0,0,0,.35)}
.node.selected{outline-color:var(--accent)}
.node.dragging{cursor:grabbing;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.node-body{padding:10px 14px;border-left:4px solid var(--mc);border-radius:var(--radius-sm)}
.node-name{font-size:12px;font-weight:600;line-height:1.3}
.node-abbr{font-size:10px;color:var(--text-sec);margin-top:1px}

/* ===== PORTS ===== */
.port{position:absolute;width:calc(var(--port-r)*2);height:calc(var(--port-r)*2);border-radius:50%;left:50%;transform:translateX(-50%);z-index:5;cursor:default;transition:transform .12s,box-shadow .12s;background:var(--bg-surface);border:2px solid var(--mc)}
.port-in{top:calc(-1*var(--port-r));cursor:default;opacity:.55}          /* 7.2: вход — не источник связи, не выглядит «кликабельным» */
.port-out{bottom:calc(-1*var(--port-r));cursor:crosshair}               /* связь тянется только отсюда, вниз */
.port-out:hover{transform:translateX(-50%) scale(1.4);box-shadow:0 0 10px var(--mc)}
.port.connected{background:var(--mc);opacity:1}
.port-in.glow{transform:translateX(-50%) scale(1.5);box-shadow:0 0 14px var(--ok);border-color:var(--ok)}   /* цель при протягивании связи */

/* ===== TOOLBAR ===== */
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--bg-surface);border-top:1px solid rgba(16,40,28,.06);flex-shrink:0}
.toolbar-info{font-size:12px;color:var(--text-sec)}
.btn{padding:8px 20px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-sec{background:var(--bg-elevated);color:var(--text)}
.btn-sec:hover{background:var(--bg-hover)}
.spacer{flex:1}

/* ===== RESULTS OVERLAY ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:all}
.results{background:var(--bg-surface);border-radius:var(--radius);padding:28px;max-width:580px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);scrollbar-width:thin;scrollbar-color:var(--bg-elevated) transparent}
.res-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.res-icon{font-size:34px;line-height:1}
.res-title{font-size:18px;font-weight:700}
.res-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.res-section-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.04em}
.calc-card{background:var(--bg-elevated);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px}
.calc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.calc-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff}
.calc-dot.ok{background:var(--ok)}.calc-dot.err{background:var(--err)}.calc-dot.warn{background:var(--warn)}
.calc-label{font-size:13px;font-weight:600}
.calc-formula{font-size:12px;color:var(--text-sec);margin-top:4px}
.calc-example{font-size:12px;color:var(--info);margin-top:6px;padding:6px 10px;background:rgba(59,130,246,.08);border-radius:6px;font-family:'SF Mono','Fira Code',monospace;line-height:1.5}
.calc-err{color:var(--err);font-size:12px;margin-top:4px}
.calc-warn{color:var(--warn);font-size:12px;margin-top:4px}
.sandbox-msg{display:flex;align-items:start;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px;line-height:1.4}
.sandbox-msg.s-ok{background:rgba(34,197,94,.08);color:var(--ok)}
.sandbox-msg.s-warn{background:rgba(234,179,8,.08);color:var(--warn)}
.sandbox-msg.s-err{background:rgba(239,68,68,.08);color:var(--err)}
.sandbox-msg.s-info{background:rgba(59,130,246,.08);color:var(--info)}

.ghost{position:fixed;z-index:1000;opacity:.75;pointer-events:none}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}

/* A360: экономика данных + help */
.q-badge{font-size:9.5px;color:#7a5c10;background:#fdf3d7;border:1px solid #e3cc8a;
  border-radius:6px;padding:0 5px;margin-top:3px;display:inline-block;line-height:15px}
.help-btn{border:1px solid rgba(16,40,28,.35);background:#fff;color:#33463c;
  opacity:.8;border-radius:50%;width:17px;height:17px;line-height:14px;font-size:10.5px;
  cursor:pointer;flex:none;padding:0;margin-left:auto}
.help-btn:hover{opacity:1;border-color:var(--accent)}
.pal-card{position:relative}
.pal-card .help-btn{position:absolute;top:6px;right:6px}
.help-btn-node{position:absolute;top:4px;right:4px}
.q-modal-back{position:fixed;inset:0;background:rgba(10,30,20,.45);display:none;
  align-items:center;justify-content:center;z-index:60}
.q-modal-back.open{display:flex}
.q-modal{background:#fff;color:#10281c;max-width:470px;width:92%;border-radius:14px;
  padding:20px 22px;box-shadow:0 18px 50px rgba(10,30,20,.35);font-size:13.5px;line-height:1.55}
.q-modal h3{margin:0 0 8px;font-size:16px}
.q-modal .q-meta{color:#7a5c10;font-size:12.5px;margin:10px 0}
.q-modal .q-row{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:12px}
.q-modal a{color:#0f7a46;font-weight:600;text-decoration:none}
.q-modal button{border:0;background:#e7efe9;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
.q-note{border-left:3px solid;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:12.5px;line-height:1.45}
.q-note.ok{border-color:#0f7a46;background:rgba(32,186,114,.10)}
.q-note.warn{border-color:#b07708;background:rgba(217,166,43,.13)}
.q-note.err{border-color:#C4453B;background:rgba(196,69,59,.10)}
.eco-badge{font-size:12px;color:var(--text-sec);background:var(--bg-elevated);
  border:1px solid rgba(16,40,28,.14);border-radius:8px;padding:4px 10px;margin-right:10px;
  display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.eco-badge b{color:var(--text)}
.eco-badge .eco-i{cursor:pointer;border:1px solid rgba(16,40,28,.3);border-radius:50%;
  width:15px;height:15px;line-height:13px;font-size:10px;text-align:center;opacity:.75}
.eco-badge .eco-i:hover{opacity:1;border-color:var(--accent)}
.overlay{background:rgba(10,30,20,.4)}
.results{background:#fff;box-shadow:0 24px 60px rgba(10,30,20,.35)}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-brand"><span class="header-title">Дерево метрик</span><span class="header-tag">Аналитика 360 · Шаг 1</span></div>
    <select id="caseSelect" class="case-select"></select>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--color-leading)"></span>Опережающие</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--color-calc)"></span>Расчётные</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--color-lagging)"></span>Запаздывающие</span>
    </div>
  </header>
  <div class="case-bar" id="caseBar"></div>
  <div class="workspace">
    <aside class="palette" id="palette"></aside>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-hint" id="canvasHint">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4.5a2 2 0 0 1 2 2V14"/></svg>
        <div>Перетащите метрики из палитры на холст<br>и соедините их рёбрами в дерево</div>
        <div style="margin-top:8px;font-size:11px">Двойной клик — добавить &middot; Del — удалить<br>Направление: тяните связь <b>вниз</b> — от нижнего порта карточки к верхнему порту следующей</div>
      </div>
      <svg class="edge-layer" id="edgeLayer">
        <defs>
          <marker id="aw" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#6b7280"/></marker>
          <marker id="aw-a" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#ff5533"/></marker>
          <marker id="aw-ok" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#22c55e"/></marker>
          <marker id="aw-err" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#ef4444"/></marker>
          <marker id="aw-t" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="rgba(16,40,28,.3)"/></marker>
        </defs>
      </svg>
      <div class="node-layer" id="nodeLayer"></div>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn btn-sec" id="btnClear">Очистить</button>
    <button class="btn btn-sec" id="btnHint">Подсказка</button>
    <span class="spacer"></span>
    <span class="toolbar-info" id="tbInfo"></span>
    <button class="btn btn-primary" id="btnCheck">Проверить</button>
  </div>
</div>
<div class="overlay" id="overlay"><div class="results" id="resPanel"></div></div>

<script>
/* ===============================================================
   SCORM 1.2 minimal wrapper — works without LMS
   =============================================================== */
const SCORM={api:null,init(){this.api=this._find(window);if(this.api)try{this.api.LMSInitialize('')}catch(e){}},done(){if(!this.api)return;try{this.api.LMSSetValue('cmi.core.lesson_status','completed');this.api.LMSCommit('')}catch(e){}},getSuspend(){if(!this.api)return null;try{return this.api.LMSGetValue('cmi.suspend_data')||null}catch(e){return null}},setSuspend(v){if(!this.api)return;try{this.api.LMSSetValue('cmi.suspend_data',v);this.api.LMSCommit('')}catch(e){}},finish(){if(this.api)try{this.api.LMSFinish('')}catch(e){}},_find(w){let n=0;while(!w.API&&w.parent!==w&&n++<10)w=w.parent;return w.API||null}};
SCORM.init();
window.addEventListener('beforeunload',()=>SCORM.finish());

/* ===============================================================
   CASE DATA

   =============================================================== */
const S={caseId:null,nodes:[],edges:[],selId:null,selType:null,nn:1,ne:1,saved:{}};

/* ===============================================================
   DOM REFS
   =============================================================== */
const $=id=>document.getElementById(id);
const pal=$('palette'),nodeL=$('nodeLayer'),edgeL=$('edgeLayer'),wrap=$('canvasWrap'),
      hint=$('canvasHint'),cSel=$('caseSelect'),cBar=$('caseBar'),
      btnC=$('btnCheck'),btnCl=$('btnClear'),btnH=$('btnHint'),
      ov=$('overlay'),resP=$('resPanel'),tbI=$('tbInfo');

/* ===============================================================
   HELPERS
   =============================================================== */
function cas(){return CASES.find(c=>c.id===S.caseId)}
function met(id){return cas()?.metrics.find(m=>m.id===id)}
function nodeByMet(mid){return S.nodes.find(n=>n.metricId===mid)}
function tColor(t){return t==='leading'?'var(--color-leading)':t==='calc'?'var(--color-calc)':'var(--color-lagging)'}
function tClass(t){return t==='leading'?'leading':t==='calc'?'calc':'lagging'}
function bezier(x1,y1,x2,y2){const d=Math.abs(y2-y1),cp=Math.max(40,d*.45);return`M${x1} ${y1}C${x1} ${y1+cp},${x2} ${y2-cp},${x2} ${y2}`}

function portPos(nid,type){
  const n=S.nodes.find(x=>x.id===nid);if(!n)return null;
  const el=nodeL.querySelector(`[data-nid="${nid}"]`);if(!el)return null;
  const w=el.offsetWidth,h=el.offsetHeight;
  return{x:n.x+w/2,y:type==='in'?n.y:n.y+h};
}

  const groups=[{t:'leading',lbl:'Опережающие'},{t:'calc',lbl:'Расчётные'},{t:'lagging',lbl:'Запаздывающие'}];
  for(const g of groups){
    const ms=c.metrics.filter(m=>m.type===g.t);if(!ms.length)continue;
    const sec=document.createElement('div');sec.className='pal-section';
    sec.innerHTML=`<div class="pal-title ${g.t}">${g.lbl}</div>`;
    for(const m of ms){
      const used=S.nodes.some(n=>n.metricId===m.id);
      const d=document.createElement('div');
      d.className='pal-card'+(used?' used':'');d.dataset.mid=m.id;
      d.innerHTML=`<span class="pal-card-dot" style="background:${tColor(m.type)}"></span><div><div class="pal-card-name">${m.name}</div><div class="pal-card-abbr">${m.abbr}</div>${m.capex!=null?`<div class="q-badge" title="CAPEX + OPEX/мес (тыс. ₽) · time-to-evidence">${m.capex}+${m.opex}/мес т₽ · ${m.tte} дн</div>`:``}</div>${m.def?`<button class="help-btn" data-mid="${m.id}" type="button" title="Что это за метрика">?</button>`:``}`;
      sec.appendChild(d);
    }
    pal.appendChild(sec);
  }
}

function markPalUsed(){
  pal.querySelectorAll('.pal-card').forEach(c=>{
    const used=S.nodes.some(n=>n.metricId===c.dataset.mid);
    c.classList.toggle('used',used);
  });
}

/* ===============================================================
   RENDERING — EDGES
   =============================================================== */
function renderEdges(){
  const exist={};
  edgeL.querySelectorAll('.edge-group').forEach(g=>{exist[g.dataset.eid]=g});
  const cur=new Set(S.edges.map(e=>e.id));
  for(const[id,g]of Object.entries(exist))if(!cur.has(id))g.remove();

  for(const edge of S.edges){
    const fp=portPos(edge.from,'out'),tp=portPos(edge.to,'in');
    if(!fp||!tp)continue;
    const d=bezier(fp.x,fp.y,tp.x,tp.y);
    let g=exist[edge.id];
    if(!g){
      g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.classList.add('edge-group');g.dataset.eid=edge.id;
      const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.classList.add('edge-hit');hit.setAttribute('stroke','transparent');
      hit.setAttribute('stroke-width','24');hit.setAttribute('fill','none');
      const line=document.createElementNS('http://www.w3.org/2000/svg','path');
      line.classList.add('edge-line');line.setAttribute('stroke','#6b7280');
      line.setAttribute('stroke-width','2');line.setAttribute('fill','none');
      line.setAttribute('marker-end','url(#aw)');
      g.appendChild(hit);g.appendChild(line);edgeL.appendChild(g);
      hit.addEventListener('click',ev=>{ev.stopPropagation();selEdge(edge.id)});
    }
    g.querySelector('.edge-hit').setAttribute('d',d);
    const line=g.querySelector('.edge-line');line.setAttribute('d',d);
    const isSel=S.selType==='edge'&&S.selId===edge.id;
    g.classList.toggle('selected',isSel);
    line.setAttribute('marker-end',isSel?'url(#aw-a)':'url(#aw)');
  }
}

/* ===============================================================
   RENDERING — UI updates
   =============================================================== */
function updHint(){hint.style.opacity=S.nodes.length?'0':'1'}
function updTb(){
  const n=S.nodes.length,e=S.edges.length;
  tbI.textContent=n?`${n} метрик · ${e} связей`:'';
  btnC.disabled=n===0;
  persist();
}
function updPorts(){
  nodeL.querySelectorAll('.port').forEach(p=>p.classList.remove('connected'));
  for(const e of S.edges){
    nodeL.querySelector(`[data-nid="${e.from}"] .port-out`)?.classList.add('connected');
    nodeL.querySelector(`[data-nid="${e.to}"] .port-in`)?.classList.add('connected');
  }
}

/* ===============================================================
   NODE / EDGE CRUD
   =============================================================== */
function addNode(mid,x,y){
  if(S.nodes.some(n=>n.metricId===mid))return;
  const m=met(mid);if(!m)return;
  const id='n'+(S.nn++);
  S.nodes.push({id,metricId:mid,x,y});
  const el=document.createElement('div');
  el.className='node';el.dataset.nid=id;el.dataset.mid=mid;
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.setProperty('--mc',tColor(m.type));
  el.innerHTML=`<div class="port port-in" data-p="in" title="Входящие связи приходят сюда (сверху)"></div><div class="node-body"><div class="node-name">${m.name}</div><div class="node-abbr">${m.abbr}</div>${m.capex!=null?`<div class="q-badge">${m.capex}+${m.opex}/мес т₽ · ${m.tte} дн</div>`:``}${m.def?`<button class="help-btn help-btn-node" data-mid="${m.id}" type="button" title="Что это за метрика">?</button>`:``}</div><div class="port port-out" data-p="out" title="Потяните отсюда вниз, чтобы создать связь"></div>`;
  nodeL.appendChild(el);
  markPalUsed();updHint();updTb();
}
function rmNode(nid){
  S.edges.filter(e=>e.from===nid||e.to===nid).forEach(e=>rmEdge(e.id));
  S.nodes=S.nodes.filter(n=>n.id!==nid);
  nodeL.querySelector(`[data-nid="${nid}"]`)?.remove();
  desel();markPalUsed();updHint();updTb();
}
function moveNode(nid,x,y){
  const n=S.nodes.find(n=>n.id===nid);if(!n)return;
  n.x=x;n.y=y;
  const el=nodeL.querySelector(`[data-nid="${nid}"]`);
  if(el){el.style.left=x+'px';el.style.top=y+'px'}
  renderEdges();
}
function addEdge(fromId,toId){
  if(fromId===toId)return;
  if(S.edges.some(e=>e.from===fromId&&e.to===toId))return;
  const id='e'+(S.ne++);
  S.edges.push({id,from:fromId,to:toId});
  renderEdges();updPorts();updTb();
}
function rmEdge(eid){
  S.edges=S.edges.filter(e=>e.id!==eid);
  edgeL.querySelector(`[data-eid="${eid}"]`)?.remove();
  desel();updPorts();updTb();
}

function selNode(nid){
  desel();S.selId=nid;S.selType='node';
  nodeL.querySelector(`[data-nid="${nid}"]`)?.classList.add('selected');
}
function selEdge(eid){
  desel();S.selId=eid;S.selType='edge';

function desel(){
  if(S.selType==='node')nodeL.querySelector(`[data-nid="${S.selId}"]`)?.classList.remove('selected');
  if(S.selType==='edge'){
    const g=edgeL.querySelector(`[data-eid="${S.selId}"]`);
    if(g){g.classList.remove('selected');g.querySelector('.edge-line')?.setAttribute('marker-end','url(#aw)')}

  S.selId=null;S.selType=null;
}

/* ===============================================================
   VALIDATION
   =============================================================== */
function hasCycle(){
  const vis=new Set,stk=new Set;
  function dfs(nid){
    vis.add(nid);stk.add(nid);
    for(const e of S.edges){
      if(e.from!==nid)continue;
      if(!vis.has(e.to)){if(dfs(e.to))return true}
      else if(stk.has(e.to))return true;
    }
    stk.delete(nid);return false;
  }
  for(const n of S.nodes)if(!vis.has(n.id)&&dfs(n.id))return true;
  return false;
}

function treeDepth(){
  const ind={},adj={};
  S.nodes.forEach(n=>{ind[n.id]=0;adj[n.id]=[]});
  S.edges.forEach(e=>{ind[e.to]=(ind[e.to]||0)+1;adj[e.from].push(e.to)});
  const q=S.nodes.filter(n=>ind[n.id]===0).map(n=>n.id),lv={};
  q.forEach(id=>lv[id]=0);
  while(q.length){const c=q.shift();for(const nx of(adj[c]||[])){lv[nx]=Math.max(lv[nx]||0,lv[c]+1);ind[nx]--;if(ind[nx]===0)q.push(nx)}}
  return Math.max(0,...Object.values(lv))+1;
}

function validate(){
  const c=cas();
  if(!c.rules)return validateSandbox();

  const res={ok:true,edges:[],metrics:[],calcs:[]};

  // Check each user edge
  for(const edge of S.edges){
    const fn=S.nodes.find(n=>n.id===edge.from);
    const tn=S.nodes.find(n=>n.id===edge.to);
    if(!fn||!tn)continue;
    const rule=c.rules[tn.metricId];
    if(!rule){
      res.edges.push({eid:edge.id,s:'invalid',msg:`${met(tn.metricId)?.name} — опережающая метрика, не имеет входных связей`});
      res.ok=false;continue;
    }
    const all=[...(rule.req||[]),...(rule.opt||[])];
    if(all.includes(fn.metricId)){
      res.edges.push({eid:edge.id,s:'ok'});
    }else{
      res.edges.push({eid:edge.id,s:'invalid',msg:`${met(fn.metricId)?.abbr} не влияет на ${met(tn.metricId)?.abbr}`});
      res.ok=false;
    }
  }

  // Check each rule metric
  for(const[mid,rule]of Object.entries(c.rules)){
    const node=nodeByMet(mid);
    if(!node){
      res.metrics.push({mid,s:'missing'});res.ok=false;continue;
    }
    const inE=S.edges.filter(e=>e.to===node.id);
    const conn=inE.map(e=>S.nodes.find(n=>n.id===e.from)?.metricId).filter(Boolean);
    const present=rule.req.filter(r=>conn.includes(r));
    const miss=rule.req.filter(r=>!conn.includes(r));
    const optP=(rule.opt||[]).filter(o=>conn.includes(o));
    const invalid=conn.filter(c=>!rule.req.includes(c)&&!(rule.opt||[]).includes(c));
    if(miss.length===0&&invalid.length===0){
      res.metrics.push({mid,s:'ok'});
      if(c.calc?.[mid])res.calcs.push({mid,...c.calc[mid],s:'ok'});
    }else{
      res.metrics.push({mid,s:'partial',miss,invalid});res.ok=false;
      if(c.calc?.[mid])res.calcs.push({mid,...c.calc[mid],s:'partial',miss});
    }
  }

  // Also check leading metrics are on canvas if they're needed
  const needed=new Set();
  for(const[,rule]of Object.entries(c.rules)){[...rule.req,...(rule.opt||[])].forEach(r=>needed.add(r))}
  for(const mid of needed){
    if(c.rules[mid])continue; // already handled in rules loop above
    if(!nodeByMet(mid)){
      res.metrics.push({mid,s:'not_on_canvas'});res.ok=false;
    }
  }

  return res;
}

function validateSandbox(){
  const msgs=[];
  if(!S.nodes.length){msgs.push({t:'info',m:'Разместите метрики на холсте и соедините их'});return{sandbox:true,msgs}}
  if(!S.edges.length){msgs.push({t:'warn',m:'Метрики не соединены — создайте связи между ними'});return{sandbox:true,msgs}}
  // 7.6: честная подпись — свободный режим без единственно верного ответа
  msgs.push({t:'info',m:'Свободный режим: единственно верного дерева здесь нет — проверяю только структуру и направление связей.'});
  if(hasCycle()){msgs.push({t:'err',m:'Обнаружен цикл. Дерево метрик должно быть ациклическим графом (DAG)'})}
  else{msgs.push({t:'ok',m:'Граф является корректным DAG (нет циклов)'})}
  const conn=new Set();S.edges.forEach(e=>{conn.add(e.from);conn.add(e.to)});
  const orph=S.nodes.filter(n=>!conn.has(n.id));
  if(orph.length)msgs.push({t:'warn',m:'Несвязанные метрики: '+orph.map(n=>met(n.metricId)?.abbr).join(', ')});
  // 7.6: простые правила по типам метрик (без «умной» валидации содержания)
  for(const n of S.nodes){
    const m=met(n.metricId);if(!m)continue;
    const hasIn=S.edges.some(e=>e.to===n.id);
    const hasOut=S.edges.some(e=>e.from===n.id);
    if(!hasIn&&!hasOut)continue; // полностью несвязанные уже перечислены выше
    if(m.type==='leading'&&hasIn)msgs.push({t:'info',m:`${m.abbr} — опережающая, обычно не имеет входящих связей`});
    if(m.type==='lagging'&&hasOut)msgs.push({t:'info',m:`${m.abbr} — запаздывающая, обычно не имеет исходящих связей`});
    if((m.type==='calc'||m.type==='lagging')&&!hasIn)msgs.push({t:'warn',m:`${m.abbr} — ${m.type==='lagging'?'итоговая':'расчётная'} метрика без входящих связей: её не из чего рассчитать`});
    if(m.type==='leading'&&!hasOut)msgs.push({t:'info',m:`${m.abbr} — опережающая метрика ни на что не влияет (нет исходящих связей)`});
  }
  const d=treeDepth();
  msgs.push({t:'info',m:`Глубина: ${d} ур. · Узлов: ${S.nodes.length} · Связей: ${S.edges.length}`});
  return{sandbox:true,msgs};
}

/* ===============================================================
   RESULTS DISPLAY
   =============================================================== */
function showRes(r){
  resP.innerHTML='';
  if(r.sandbox)return showSandbox(r);

  const c=cas();
  const hd=document.createElement('div');hd.className='res-head';
  if(r.ok){
    hd.innerHTML=`<span class="res-icon pop">&#9989;</span><div><div class="res-title">Дерево построено правильно!</div><div class="res-sub">Все связи корректны, расчётная цепочка полна</div></div>`;
    SCORM.done();
  }else{
    const corr=r.edges.filter(e=>e.s==='ok').length;
    const total=Object.values(c.rules).reduce((s,rl)=>s+rl.req.length+(rl.opt||[]).length,0);
    hd.innerHTML=`<span class="res-icon">&#9888;&#65039;</span><div><div class="res-title">Есть замечания</div><div class="res-sub">Верных связей: ${corr} из ${total} возможных</div></div>`;
  }
  resP.appendChild(hd);

  // Missing metrics
  const miss=r.metrics.filter(m=>m.s==='missing'||m.s==='not_on_canvas');
  if(miss.length){
    const sec=document.createElement('div');
    sec.innerHTML='<div class="res-section-title" style="color:var(--warn)">Метрики не на холсте</div>';
    for(const m of miss){
      const metric=met(m.mid);
      const d=document.createElement('div');d.className='calc-card';
      d.innerHTML=`<div class="calc-head"><span class="calc-dot warn">!</span><span class="calc-label">${metric?.name||m.mid} (${metric?.abbr||''})</span></div><div class="calc-warn">Разместите эту метрику на холсте</div>`;
      sec.appendChild(d);
    }
    resP.appendChild(sec);
  }

  // Calculation chain
  if(c.calc){
    const sec=document.createElement('div');
    sec.innerHTML='<div class="res-section-title">Цепочка расчётов</div>';
    for(const[mid,cl]of Object.entries(c.calc)){
      const ri=r.calcs.find(x=>x.mid===mid);
      const metric=met(mid);
      const d=document.createElement('div');d.className='calc-card';
      if(ri&&ri.s==='ok'){
        d.innerHTML=`<div class="calc-head"><span class="calc-dot ok">&#10003;</span><span class="calc-label">${cl.lbl}</span></div><div class="calc-formula">${cl.formula}</div><div class="calc-example">${cl.example}</div>`;
      }else if(ri&&ri.s==='partial'){
        const mNames=(ri.miss||[]).map(m=>met(m)?.abbr||m).join(', ');
        d.innerHTML=`<div class="calc-head"><span class="calc-dot warn">!</span><span class="calc-label">${cl.lbl}</span></div><div class="calc-formula">${cl.formula}</div><div class="calc-warn">Не хватает: ${mNames}</div>`;
      }else{
        d.innerHTML=`<div class="calc-head"><span class="calc-dot err">&#10007;</span><span class="calc-label">${cl.lbl}</span></div><div class="calc-err">${metric?.name||mid} не на холсте</div>`;
      }
      sec.appendChild(d);
    }
    resP.appendChild(sec);
  }

  // Invalid edges
  const inv=r.edges.filter(e=>e.s==='invalid');
  if(inv.length){
    const sec=document.createElement('div');
    sec.innerHTML='<div class="res-section-title" style="color:var(--err)">Некорректные связи</div>';
    for(const e of inv){
      const d=document.createElement('div');d.className='calc-card';
      d.innerHTML=`<div class="calc-head"><span class="calc-dot err">&#10007;</span><span class="calc-label">${e.msg||'Неверная связь'}</span></div>`;
      sec.appendChild(d);
    }
    resP.appendChild(sec);
  }

  // Close button
  const btn=document.createElement('button');btn.className='btn btn-primary';
  btn.style.cssText='margin-top:16px;width:100%';btn.textContent='Закрыть';
  btn.addEventListener('click',hideRes);resP.appendChild(btn);
  ov.classList.add('show');
  colorEdges(r);
}

function showSandbox(r){
  const hd=document.createElement('div');hd.className='res-head';
  hd.innerHTML='<span class="res-icon">&#128736;&#65039;</span><div><div class="res-title">Анализ дерева метрик</div><div class="res-sub">Свободный конструктор — структурная проверка</div></div>';
  resP.appendChild(hd);
  for(const m of r.msgs){
    const cls={ok:'s-ok',warn:'s-warn',err:'s-err',info:'s-info'}[m.t]||'s-info';
    const ico={ok:'&#10003;',warn:'&#9888;',err:'&#10007;',info:'&#8505;'}[m.t]||'&#8505;';
    const d=document.createElement('div');d.className='sandbox-msg '+cls;
    d.innerHTML=`<span>${ico}</span><span>${m.m}</span>`;
    resP.appendChild(d);
  }
  const btn=document.createElement('button');btn.className='btn btn-primary';
  btn.style.cssText='margin-top:16px;width:100%';btn.textContent='Закрыть';
  btn.addEventListener('click',hideRes);resP.appendChild(btn);
  ov.classList.add('show');
}

function colorEdges(r){
  if(!r.edges)return;
  for(const e of r.edges){
    const g=edgeL.querySelector(`[data-eid="${e.eid}"]`);if(!g)continue;
    g.classList.remove('correct','invalid');
    if(e.s==='ok'){g.classList.add('correct');g.querySelector('.edge-line')?.setAttribute('marker-end','url(#aw-ok)')}
    if(e.s==='invalid'){g.classList.add('invalid');g.querySelector('.edge-line')?.setAttribute('marker-end','url(#aw-err)')}
  }
}
function clearEdgeColors(){
  edgeL.querySelectorAll('.edge-group').forEach(g=>{
    g.classList.remove('correct','invalid');
    g.querySelector('.edge-line')?.setAttribute('marker-end','url(#aw)');
  });
}

function hideRes(){ov.classList.remove('show');clearEdgeColors()}

/* ===============================================================
   CASE MANAGEMENT
   =============================================================== */
function saveState(){
  S.saved[S.caseId]={nodes:JSON.parse(JSON.stringify(S.nodes)),edges:JSON.parse(JSON.stringify(S.edges)),nn:S.nn,ne:S.ne};
}

/* 7.7: сохранение состояния между заходами — SCORM cmi.suspend_data + localStorage-фолбэк */
const LSKEY='dddm_metric_tree_v1';
function persist(){
  if(!S.caseId)return;
  const saved={...S.saved,[S.caseId]:{nodes:S.nodes,edges:S.edges,nn:S.nn,ne:S.ne}};
  const data=JSON.stringify({v:1,caseId:S.caseId,saved});
  try{localStorage.setItem(LSKEY,data)}catch(e){}
  SCORM.setSuspend(data);
}
function restore(){
  let data=SCORM.getSuspend();
  if(!data){try{data=localStorage.getItem(LSKEY)}catch(e){data=null}}
  if(!data)return null;
  try{const o=JSON.parse(data);if(o&&o.saved){S.saved=o.saved;return o.caseId||null}}catch(e){}
  return null;
}
function loadCase(id){
  if(S.caseId)saveState();
  S.caseId=id;
  const saved=S.saved[id];
  if(saved){S.nodes=saved.nodes;S.edges=saved.edges;S.nn=saved.nn;S.ne=saved.ne}
  else{S.nodes=[];S.edges=[];S.nn=1;S.ne=1}
  const c=cas();
  cBar.innerHTML=c.desc+' <span class="dir-hint">· Стройте сверху вниз: опережающие → расчётные → запаздывающие. Связь тянется от нижнего порта карточки к верхнему порту следующей.</span>';
  desel();clearEdgeColors();
  // Rebuild DOM
  nodeL.innerHTML='';edgeL.querySelectorAll('.edge-group').forEach(g=>g.remove());
  for(const n of S.nodes){
    const m=met(n.metricId);if(!m)continue;
    const el=document.createElement('div');
    el.className='node';el.dataset.nid=n.id;el.dataset.mid=n.metricId;
    el.style.left=n.x+'px';el.style.top=n.y+'px';
    el.style.setProperty('--mc',tColor(m.type));
    el.innerHTML=`<div class="port port-in" data-p="in" title="Входящие связи приходят сюда (сверху)"></div><div class="node-body"><div class="node-name">${m.name}</div><div class="node-abbr">${m.abbr}</div></div><div class="port port-out" data-p="out" title="Потяните отсюда вниз, чтобы создать связь"></div>`;
    nodeL.appendChild(el);
  }
  renderEdges();renderPal();updPorts();updHint();updTb();
}

function clearCanvas(){
  if(!S.nodes.length)return;
  confirmPanel('Очистить холст?','Все метрики и связи текущего кейса будут удалены.','Очистить',()=>{
    S.nodes=[];S.edges=[];S.nn=1;S.ne=1;
    nodeL.innerHTML='';edgeL.querySelectorAll('.edge-group').forEach(g=>g.remove());
    desel();clearEdgeColors();renderPal();updPorts();updHint();updTb();
  });
}

/* Подсказка/подтверждение в стиле ЛМС — через тот же оверлей, без нативных alert()/confirm() */
function hintPanel(title,sub,lines){
  resP.innerHTML='';
  const hd=document.createElement('div');hd.className='res-head';
  hd.innerHTML=`<span class="res-icon">&#128161;</span><div><div class="res-title">${title}</div><div class="res-sub">${sub}</div></div>`;
  resP.appendChild(hd);
  for(const ln of lines){
    const d=document.createElement('div');d.className='sandbox-msg s-info';
    d.innerHTML=`<span>&#8505;</span><span>${ln}</span>`;
    resP.appendChild(d);
  }
  const btn=document.createElement('button');btn.className='btn btn-primary';
  btn.style.cssText='margin-top:16px;width:100%';btn.textContent='Понятно';
  btn.addEventListener('click',hideRes);resP.appendChild(btn);
  ov.classList.add('show');
}
function confirmPanel(title,sub,okLabel,onYes){
  resP.innerHTML='';
  const hd=document.createElement('div');hd.className='res-head';
  hd.innerHTML=`<span class="res-icon">&#128465;&#65039;</span><div><div class="res-title">${title}</div><div class="res-sub">${sub}</div></div>`;
  resP.appendChild(hd);
  const row=document.createElement('div');row.style.cssText='display:flex;gap:10px;margin-top:16px';
  const no=document.createElement('button');no.className='btn btn-sec';no.style.flex='1';no.textContent='Отмена';
  const yes=document.createElement('button');yes.className='btn btn-primary';yes.style.flex='1';yes.textContent=okLabel;
  no.addEventListener('click',hideRes);
  yes.addEventListener('click',()=>{hideRes();onYes()});
  row.appendChild(no);row.appendChild(yes);resP.appendChild(row);
  ov.classList.add('show');
}

/* Ближайшие нужные шаги по эталону кейса (не весь ответ — максимум 2 действия) */
function nextHints(c){
  const out=[];
  for(const[mid,rule]of Object.entries(c.rules)){
    const node=nodeByMet(mid);
    const conn=node?S.edges.filter(e=>e.to===node.id).map(e=>S.nodes.find(n=>n.id===e.from)?.metricId):[];
    if(!node)out.push(`Добавьте на холст «${met(mid)?.name}» и подведите к ней входящие связи`);
    for(const r of(rule.req||[])){
      if(node&&conn.includes(r))continue;
      if(!nodeByMet(r))out.push(`Добавьте «${met(r)?.name}» и свяжите её с «${met(mid)?.name}»`);
      else out.push(`Свяжите «${met(r)?.name}» → «${met(mid)?.name}»`);
      if(out.length>=2)return out.slice(0,2);
    }
    if(out.length>=2)break;
  }
  return out.slice(0,2);
}

function showHint(){
  const c=cas();
  if(!c.rules){
    hintPanel('Свободный режим','Конструктор без единственно верного ответа',[
      'Стройте дерево сверху вниз: опережающие показатели — вверху, итоговые (запаздывающие) — внизу.',
      'Каждая расчётная и итоговая метрика должна получать входящие связи от тех метрик, из которых она считается.',
      'Нажмите «Проверить» — покажу структурный разбор графа: циклы, «висящие» метрики, направление связей.'
    ]);
    return;
  }
  const lagging=c.metrics.find(m=>m.type==='lagging');
  const lines=[`Стройте дерево сверху вниз — от опережающих показателей к итоговой метрике${lagging?` («${lagging.name}»)`:''}.`];
  const steps=nextHints(c);
  if(steps.length){lines.push('Ближайшие шаги:');steps.forEach(s=>lines.push('• '+s))}
  else lines.push('Все обязательные связи уже на месте — нажмите «Проверить».');
  hintPanel('Подсказка',c.title.replace(/^\d+\.\s*/,''),lines);
  const flash=new Set();
  for(const[mid,rule]of Object.entries(c.rules)){flash.add(mid);(rule.req||[]).forEach(r=>flash.add(r))}
  pal.querySelectorAll('.pal-card').forEach(card=>{
    if(flash.has(card.dataset.mid)){card.classList.add('hint');setTimeout(()=>card.classList.remove('hint'),1500)}
  });
}

/* ===============================================================
   INIT
   =============================================================== */
function init(){
  CASES.forEach(c=>{
    const o=document.createElement('option');o.value=c.id;o.textContent=c.title;
    cSel.appendChild(o);
  });
  cSel.addEventListener('change',()=>loadCase(cSel.value));
  btnC.addEventListener('click',()=>{const r=validate();showRes(r)});
  btnCl.addEventListener('click',clearCanvas);
  btnH.addEventListener('click',showHint);
  ov.addEventListener('click',e=>{if(e.target===ov)hideRes()});
  const rid=restore();
  const startId=rid&&CASES.some(c=>c.id===rid)?rid:CASES[0].id;
  cSel.value=startId;
  loadCase(startId);
}
init();
</script>

<div class="q-modal-back" id="qModalBack">
  <div class="q-modal">
    <h3 id="qModalTitle"></h3>
    <div id="qModalBody"></div>
    <div class="q-meta" id="qModalMeta"></div>
    <div class="q-row">
      <a id="qModalLink" target="_blank" rel="noopener">Подробнее в справочнике &rarr;</a>
      <button id="qModalClose" type="button">Закрыть</button>
    </div>
  </div>
</div>
<script>
/* A360-расширение: экономика ансамбля, изолированные метрики, help-модалка. */
(function(){
  var back=document.getElementById('qModalBack');

  function openModal(title,body,meta,link){
    document.getElementById('qModalTitle').textContent=title;
    document.getElementById('qModalBody').textContent=body;
    document.getElementById('qModalMeta').textContent=meta||'';
    var a=document.getElementById('qModalLink');
    if(link){a.style.display='';a.href=link}else{a.style.display='none'}
    back.classList.add('open');
  }
  function openHelp(mid){
    var m=met(mid);if(!m)return;
    openModal(m.name+' ('+m.abbr+')',m.def||'',
      m.capex!=null?('Экономика сбора: CAPEX '+m.capex+' т₽ единоразово · OPEX '+m.opex+
        ' т₽/мес (сбор и обработка) · time-to-evidence ~'+m.tte+' дн'):'',m.link);
  }
  var CRIT_TEXT='TTE ансамбля — время до доверяемого решения по критическому пути дерева: '+
    'у каждой метрики свой срок сбора, расчётные уровни наследуют максимум входов, а '+
    'накопительные сверки в сочленениях добавляют время. Поэтому быстрая метрика на первом '+
    'уровне не гарантирует быстрого решения — выигрывает ансамбль в целом. '+
    'TCO за горизонт пилота = сумма CAPEX + месяцы × сумма OPEX по всем метрикам дерева. '+
    'Критерий сравнения — принцип Cost of Delay (Д. Райнертсен, The Principles of Product '+
    'Development Flow): задержка решения имеет денежную цену. Конфигурации сравниваются по '+
    'CD3 = Cost of Delay / Duration (он же WSJF в SAFe): при равной ценности решения это '+
    '1 / (TTE × TCO) — «скорость доверяемого решения на рубль». Актуальность данных '+
    '(timeliness) — характеристика качества по ISO/IEC 25012; цену некачественных данных '+
    'Gartner оценивает в $12,9 млн в год на компанию.';

  ['mousedown','dblclick'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(e.target.closest&&(e.target.closest('.help-btn')||e.target.closest('.eco-i')))e.stopPropagation();
    },true);
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.help-btn');
    if(b){e.stopPropagation();openHelp(b.dataset.mid);return}
    if(e.target.closest&&e.target.closest('.eco-i')){
      e.stopPropagation();
      openModal('Как считается эффективность конфигурации',CRIT_TEXT,'','longread_metrics.html#eco');return}
    if(e.target===back||e.target.id==='qModalClose')back.classList.remove('open');
  },true);

  /* ── экономика ансамбля: каскад TTE по построенному графу ── */
  function cascade(){
    var c=cas();var memo={};var lags=c.lags||[];
    function T(nid){
      if(memo[nid]!=null)return memo[nid];
      memo[nid]=0; /* защита от циклов */
      var n=S.nodes.find(function(x){return x.id===nid});
      var m=n&&met(n.metricId);var own=(m&&m.tte)||0;
      var ins=S.edges.filter(function(e){return e.to===nid});
      var mx=0;
      ins.forEach(function(e){mx=Math.max(mx,T(e.from))});
      var extra=0;
      lags.forEach(function(L){
        if(n&&L.target===n.metricId&&ins.some(function(e){
          var sn=S.nodes.find(function(x){return x.id===e.from});
          return sn&&sn.metricId===L.source}))extra+=L.extra;
      });
      memo[nid]=own+mx+extra;
      return memo[nid];
    }
    var res={};S.nodes.forEach(function(n){res[n.metricId]=T(n.id)});
    return res;
  }
  function ecoNow(){
    var c=cas();if(!c)return null;
    var msArr=S.nodes.map(function(n){return met(n.metricId)})
      .filter(function(m){return m&&m.capex!=null});
    if(!msArr.length)return null;
    var H=c.horizon||3;
    var capex=msArr.reduce(function(s,m){return s+m.capex},0);
    var opex=msArr.reduce(function(s,m){return s+m.opex},0);
    var tco=capex+H*opex;
    var casc=cascade();
    var tte=0;
    if(c.decision&&casc[c.decision]!=null)tte=casc[c.decision];
    else for(var k in casc)tte=Math.max(tte,casc[k]);
    return {tte:tte,tco:tco,H:H,e:(tte&&tco)?1e6/(tte*tco):0,
            decisionOn:c.decision&&casc[c.decision]!=null};
  }
  function ecoIdeal(){
    var c=cas();if(!c||!c.idealEco)return null;
    var i=c.idealEco;return {tte:i.tte,tco:i.tco,e:1e6/(i.tte*i.tco)};
  }

  /* живой замер в тулбаре */
  var tb=document.querySelector('.toolbar');
  var eb=document.createElement('span');eb.className='eco-badge';eb.style.display='none';
  var tbInfo=document.getElementById('tbInfo');
  tb.insertBefore(eb,tbInfo);
  var _updTb=updTb;
  updTb=function(){
    _updTb();
    var eco=ecoNow();
    if(!eco||!S.nodes.length){eb.style.display='none';return}
    eb.style.display='';
    eb.innerHTML='TTE ансамбля <b>'+(eco.tte||'—')+(eco.tte?' дн':'')+'</b> · TCO('+eco.H+
      ' мес) <b>'+eco.tco+' т₽</b> <span class="eco-i" title="как это считается">i</span>';
  };

  /* ── проверка: развилки, изолированные метрики, эффективность ── */
  var _validate=validate;
  validate=function(){
    var r=_validate();
    if(r.sandbox){
      var isoS=S.nodes.filter(function(n){return !S.edges.some(function(e){return e.from===n.id||e.to===n.id})});
      if(isoS.length&&r.msgs)r.msgs.push({t:'warn',m:'Изолированные метрики (без единой связи): '+
        isoS.map(function(n){return met(n.metricId).name}).join(', ')});
      return r;
    }
    var c=cas();r.qmsgs=[];
    var absentAllowed=[];
    (c.quality||[]).forEach(function(g){
      var tn=nodeByMet(g.target);
      var conn=tn?S.edges.filter(function(e){return e.to===tn.id})
        .map(function(e){var n=S.nodes.find(function(x){return x.id===e.from});return n&&n.metricId})
        .filter(Boolean):[];
      var chosen=g.options.filter(function(o){return conn.indexOf(o)>=0});
      if(!tn||!chosen.length){
        r.qmsgs.push({t:'err',m:'Для «'+met(g.target).name+'» нужен один из источников: '+
          g.options.map(function(o){return met(o).name}).join(' / ')});
      }else{
        g.options.forEach(function(o){if(chosen.indexOf(o)<0)absentAllowed.push(o)});
        if(chosen.length===1&&chosen[0]===g.best){
          r.qmsgs.push({t:'ok',m:g.okNote||('Конфигурация оптимальна: '+met(g.best).name)});
        }else{
          r.qmsgs.push({t:'warn',m:g.note});
        }
      }
    });
    r.metrics=r.metrics.filter(function(m){
      return !((m.s==='not_on_canvas'||m.s==='missing')&&absentAllowed.indexOf(m.mid)>=0)});
    r.iso=S.nodes.filter(function(n){return !S.edges.some(function(e){return e.from===n.id||e.to===n.id})})
      .map(function(n){return n.metricId});
    var edgesOk=r.edges.every(function(e){return e.s==='ok'});
    var metricsOk=r.metrics.every(function(m){return m.s==='ok'});
    var qOk=r.qmsgs.every(function(q){return q.t!=='err'});
    r.ok=edgesOk&&metricsOk&&qOk&&!r.iso.length;
    return r;
  };

  function connectHint(mid){
    var c=cas();var to=[],from=[];
    for(var k in (c.rules||{})){
      var rl=c.rules[k];
      if((rl.req||[]).indexOf(mid)>=0||(rl.opt||[]).indexOf(mid)>=0)to.push(met(k).name);
    }
    if(c.rules&&c.rules[mid]){
      var rl2=c.rules[mid];
      from=(rl2.req||[]).concat(rl2.opt||[]).map(function(x){return met(x).name});
    }
    var parts=[];
    if(to.length)parts.push('влияет на: '+to.join(', '));
    if(from.length)parts.push('рассчитывается из: '+from.join(', '));
    return parts.join(' · ')||'соедините с деревом';
  }

  var _showRes=showRes;
  showRes=function(r){
    _showRes(r);
    if(!r||r.sandbox)return;
    if(r.iso&&r.iso.length){
      var si=document.createElement('div');
      si.innerHTML='<div class="res-section-title" style="color:var(--err)">Метрики без связей</div>';
      r.iso.forEach(function(mid){
        var d=document.createElement('div');d.className='q-note err';
        d.textContent='\u2715 «'+met(mid).name+'» лежит на холсте, но ни с чем не связана — '+
          'несобранные данные не работают. Подключите: '+connectHint(mid);
        si.appendChild(d);
      });
      resP.appendChild(si);
    }
    if(r.qmsgs&&r.qmsgs.length){
      var sq=document.createElement('div');
      sq.innerHTML='<div class="res-section-title">Качество данных конфигурации</div>';
      r.qmsgs.forEach(function(q){
        var d=document.createElement('div');d.className='q-note '+q.t;
        d.textContent=(q.t==='ok'?'\u2713 ':q.t==='warn'?'\u26a0 ':'\u2715 ')+q.m;
        sq.appendChild(d);
      });
      resP.appendChild(sq);
    }
    var eco=ecoNow();
    if(eco){
      var c=cas();
      var se=document.createElement('div');
      se.innerHTML='<div class="res-section-title">Экономика конфигурации</div>';
      var dn=c.decision&&met(c.decision)?(' до «'+met(c.decision).name+'»'):'';
      var line='TTE ансамбля'+dn+': '+eco.tte+' дн · TCO за '+eco.H+' мес: '+eco.tco+' т₽';
      var ideal=ecoIdeal();
      var cls='ok',txt;
      if(ideal&&r.ok){
        var eff=Math.min(100,Math.round(100*eco.e/ideal.e));
        if(eff>=100){txt='\u2713 '+line+' · эффективность 100 % — лучшая конфигурация кейса';}
        else{cls='warn';txt='\u26a0 '+line+' · эффективность '+eff+' % от лучшей — смотрите '+
          'на развилки и сочленения (критерий Cost of Delay / CD3, кнопка i внизу)';}
      }else{
        cls=r.ok?'ok':'warn';txt=(r.ok?'\u2713 ':'\u26a0 ')+line;
      }
      var d2=document.createElement('div');d2.className='q-note '+cls;d2.textContent=txt;
      se.appendChild(d2);
      resP.appendChild(se);
    }
    var closeBtn=resP.querySelector('button');
    if(closeBtn)resP.appendChild(closeBtn);
  };
})();
</script>
